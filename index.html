<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FELT — Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F2F0EB; --surface: #FFFFFF; --border: #E0DBD2; --text: #0F1F35; --muted: #7A7570;
    --accent: #F0C040; --accent-dark: #D4A820; --accent-light: #FEF8DC;
    --navy: #0F1F35; --blue: #2563EB; --blue-light: #DBEAFE;
    --green: #16A34A; --green-light: #DCFCE7; --red: #DC2626; --red-light: #FEE2E2;
    --purple: #7C3AED; --purple-light: #EDE9FE;
    --radius: 10px; --sidebar-w: 230px; --bottom-nav-h: 64px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }

  .sidebar { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; flex-shrink: 0; padding: 0 0 24px; z-index: 20; }
  .sidebar-logo { padding: 26px 22px 22px; font-size: 22px; font-weight: 800; letter-spacing: 6px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 10px; }
  .sidebar-logo span { color: var(--accent); }
  .nav-section { padding: 0 10px; margin-bottom: 2px; }
  .nav-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.28); padding: 10px 12px 5px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 7px; cursor: pointer; color: rgba(255,255,255,0.55); font-size: 13.5px; transition: all 0.15s; user-select: none; }
  .nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .nav-item.active { background: var(--accent); color: var(--navy); font-weight: 700; }
  .nav-item .icon { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
  .sidebar-footer { margin-top: auto; padding: 0 10px; }
  .user-chip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: rgba(255,255,255,0.45); font-size: 13px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--navy); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-h); background: var(--navy); z-index: 50; align-items: center; justify-content: space-around; padding: 0 4px; border-top: 1px solid rgba(255,255,255,0.08); }
  .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 6px; cursor: pointer; color: rgba(255,255,255,0.45); font-size: 10px; transition: all 0.15s; min-width: 44px; }
  .bottom-nav-item .bn-icon { font-size: 18px; line-height: 1; }
  .bottom-nav-item.active { color: var(--accent); }

  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: var(--bg); padding: 22px 28px 0; display: flex; align-items: flex-start; justify-content: space-between; position: sticky; top: 0; z-index: 10; gap: 12px; }
  .page-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
  .btn-primary { background: var(--accent); color: var(--navy); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
  .btn-ghost:hover { background: var(--surface); color: var(--text); }
  .btn-green { background: var(--green); color: #fff; border: none; }
  .btn-green:hover { background: #15803d; }
  .btn-sm { padding: 5px 11px; font-size: 12px; }

  .content { padding: 20px 28px 40px; }
  .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -1px; color: var(--navy); }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden; }
  .project-card:hover { box-shadow: 0 4px 20px rgba(15,31,53,0.1); transform: translateY(-1px); }
  .project-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .project-card.status-active::before { background: var(--green); }
  .project-card.status-planning::before { background: var(--accent); }
  .project-card.status-pitched::before { background: var(--blue); }
  .project-card.status-completed::before { background: var(--muted); }
  .project-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
  .project-name { font-size: 14px; font-weight: 700; }
  .project-client { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .status-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .badge-active { background: var(--green-light); color: var(--green); }
  .badge-planning { background: var(--accent-light); color: #92700A; }
  .badge-completed { background: #f0f0f0; color: var(--muted); }
  .badge-pitched { background: var(--blue-light); color: var(--blue); }
  .badge-not-contacted { background: #f0f0f0; color: var(--muted); }
  .badge-reached-out { background: var(--accent-light); color: #92700A; }
  .badge-in-conversation { background: var(--blue-light); color: var(--blue); }
  .badge-proposal-sent { background: var(--purple-light); color: var(--purple); }
  .badge-won { background: var(--green-light); color: var(--green); }
  .badge-lost { background: var(--red-light); color: var(--red); }

  .project-meta { display: flex; gap: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .meta-item { font-size: 11px; color: var(--muted); }
  .meta-item strong { color: var(--text); display: block; font-size: 12px; font-weight: 600; }
  .budget-bar { height: 5px; background: var(--border); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .budget-bar-fill { height: 100%; border-radius: 3px; background: var(--green); }
  .budget-bar-fill.over { background: var(--red); }
  .team-avatars { display: flex; }
  .team-avatar-sm { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-light); color: var(--navy); font-size: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface); margin-right: -5px; }

  .back-btn { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; cursor: pointer; margin-bottom: 14px; width: fit-content; }
  .back-btn:hover { color: var(--text); }
  .tabs { display: flex; gap: 3px; margin-bottom: 18px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 4px; width: fit-content; overflow-x: auto; max-width: 100%; }
  .tab { padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); transition: all 0.15s; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--navy); color: var(--accent); font-weight: 700; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  input, textarea, select { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); transition: border 0.15s; outline: none; width: 100%; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: vertical; min-height: 90px; }

  .budget-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .budget-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .budget-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 5px; font-weight: 700; }
  .budget-value { font-size: 22px; font-weight: 800; color: var(--navy); }
  .budget-value.over { color: var(--red); }
  .budget-value.good { color: var(--green); }

  .table-wrap { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; min-width: 400px; }
  .table th { text-align: left; padding: 9px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); border-bottom: 1.5px solid var(--border); font-weight: 700; }
  .table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .table tr:last-child td { border-bottom: none; }
  .table tr:hover td { background: var(--bg); }

  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .team-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .team-avatar-lg { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-light); color: var(--navy); font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; border: 2px solid var(--accent); }
  .team-name { font-size: 14px; font-weight: 700; }
  .team-role { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .team-rate { font-size: 13px; font-weight: 700; color: var(--blue); margin-top: 6px; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 8px; }
  .skill-tag { font-size: 10px; padding: 2px 7px; background: var(--navy); color: var(--accent); border-radius: 20px; font-weight: 700; }

  .contact-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .contact-row:last-child { border-bottom: none; }
  .contact-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue-light); color: var(--blue); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .contact-name { font-size: 14px; font-weight: 600; }
  .contact-detail { font-size: 12px; color: var(--muted); }
  .contact-actions { margin-left: auto; display: flex; gap: 6px; }

  .pipeline { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .pipeline-col { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
  .pipeline-col-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .pipeline-col-count { font-size: 24px; font-weight: 800; color: var(--navy); }
  .pipeline-col-value { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .lead-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .lead-row:last-child { border-bottom: none; }
  .lead-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-light); color: var(--navy); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .lead-name { font-size: 14px; font-weight: 700; }
  .lead-detail { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .lead-notes { font-size: 13px; color: var(--text); margin-top: 5px; line-height: 1.45; }
  .lead-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }

  /* ── SIGN-OFF ─────────────────────────────────────────── */
  .signoff-header {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .signoff-progress-label {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .signoff-progress-text { font-size: 13px; font-weight: 700; color: var(--navy); }
  .signoff-progress-pct { font-size: 12px; color: var(--muted); }
  .signoff-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .signoff-bar-fill { height: 100%; border-radius: 4px; background: var(--green); transition: width 0.4s; }
  .signoff-current { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .signoff-current strong { color: var(--navy); }

  .signoff-list { display: flex; flex-direction: column; gap: 6px; }

  .signoff-step {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: all 0.15s;
  }

  .signoff-step.completed { border-color: var(--green-light); background: #FAFFFE; }
  .signoff-step.current { border-color: var(--accent); background: var(--accent-light); }
  .signoff-step.future { opacity: 0.55; }

  .signoff-icon {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; flex-shrink: 0;
  }
  .signoff-icon.done { background: var(--green); color: #fff; }
  .signoff-icon.next { background: var(--accent); color: var(--navy); }
  .signoff-icon.pending { background: var(--border); color: var(--muted); }

  .signoff-step-info { flex: 1; min-width: 0; }
  .signoff-step-label { font-size: 14px; font-weight: 700; color: var(--navy); }
  .signoff-step-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .signoff-step-meta strong { color: var(--green); }

  .signoff-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* ── CALENDAR ─────────────────────────────────────────── */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-month { font-size: 18px; font-weight: 800; color: var(--navy); }
  .cal-grid { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 24px; }
  .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1.5px solid var(--border); }
  .cal-header-cell { padding: 8px 0; text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .cal-body { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-day { min-height: 80px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; }
  .cal-day:nth-child(7n) { border-right: none; }
  .cal-day.other-month { background: var(--bg); }
  .cal-day.today { background: var(--accent-light); }
  .cal-day-num { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; line-height: 1; }
  .cal-day.today .cal-day-num { background: var(--accent); color: var(--navy); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .cal-event { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .cal-event.ev-active { background: var(--green-light); color: var(--green); }
  .cal-event.ev-planning { background: var(--accent-light); color: #92700A; }
  .cal-event.ev-pitched { background: var(--blue-light); color: var(--blue); }
  .cal-event.ev-completed { background: #f0f0f0; color: var(--muted); }
  .cal-list { display: flex; flex-direction: column; gap: 8px; }
  .cal-list-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.15s; }
  .cal-list-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .cal-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── IDEAS ────────────────────────────────────────────── */
  .ideas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .idea-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; position: relative; transition: all 0.15s; }
  .idea-card:hover { box-shadow: 0 4px 16px rgba(15,31,53,0.08); transform: translateY(-1px); }
  .idea-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); border-radius: var(--radius) var(--radius) 0 0; }
  .idea-category-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; width: fit-content; background: var(--navy); color: var(--accent); }
  .idea-title { font-size: 15px; font-weight: 800; color: var(--navy); line-height: 1.3; }
  .idea-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .idea-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border); margin-top: auto; }
  .idea-by { font-size: 11px; color: var(--muted); }
  .idea-by strong { color: var(--text); }

  .brief-content { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 22px; }
  .brief-section { margin-bottom: 20px; }
  .brief-section:last-child { margin-bottom: 0; }
  .brief-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 7px; font-weight: 700; }
  .brief-section-content { font-size: 14px; line-height: 1.65; color: var(--text); white-space: pre-wrap; }

  .allocate-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .allocate-row:last-child { border-bottom: none; }
  .allocate-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .section-title { font-size: 15px; font-weight: 800; color: var(--navy); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-state .empty-icon { font-size: 32px; margin-bottom: 10px; }
  .empty-state p { font-size: 13px; }
  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  .storage-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--green); background: var(--green-light); padding: 3px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15,31,53,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 16px; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border-radius: 14px; padding: 24px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; transform: translateY(12px); transition: transform 0.2s; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 18px; color: var(--navy); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  .toast { position: fixed; bottom: 80px; right: 20px; background: var(--navy); color: var(--accent); padding: 11px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; z-index: 200; transform: translateY(60px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { display: none; }
    .bottom-nav { display: flex; }
    .main { flex: 1; padding-bottom: var(--bottom-nav-h); }
    .topbar { padding: 16px 16px 0; }
    .page-title { font-size: 18px; }
    .content { padding: 14px 16px 30px; }
    .stats-row { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-value { font-size: 22px; }
    .projects-grid { grid-template-columns: 1fr; }
    .team-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .ideas-grid { grid-template-columns: 1fr; }
    .budget-summary { grid-template-columns: 1fr; gap: 10px; }
    .pipeline { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .modal { padding: 20px; }
    .cal-day { min-height: 52px; padding: 4px; }

// ─── STORAGE ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'felt-studio-v2';
function loadStore() { try { const s=localStorage.getItem(STORAGE_KEY); if(s) return JSON.parse(s); } catch(e){} return JSON.parse(JSON.stringify(defaultData)); }
function save() { try { localStorage.setItem(STORAGE_KEY,JSON.stringify(store)); } catch(e){} }
const store = loadStore();

// Ensure all projects have signoff data (migration for older saves)
store.projects.forEach(p => { if (!p.signoff) p.signoff = emptySignoff(); });

// ─── ROUTING ──────────────────────────────────────────────────────────────────
let currentView='dashboard', currentProject=null, currentTab='brief';
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();

function navigate(view, projectId) {
  currentView=view;
  if(projectId!==undefined){currentProject=store.projects.find(p=>p.id===projectId);currentTab='brief';}
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.bottom-nav-item').forEach(el=>el.classList.remove('active'));
  const navMap={dashboard:0,projects:1,leads:2,calendar:3,ideas:4,team:5,contacts:6};
  const bnMap={dashboard:0,projects:1,leads:2,calendar:3,ideas:4,team:5};
  document.querySelectorAll('.nav-item')[navMap[view]]?.classList.add('active');
  document.querySelectorAll('.bottom-nav-item')[bnMap[view]]?.classList.add('active');
  document.getElementById('main').scrollTo(0,0);
  render();
}

function render() {
  const m=document.getElementById('main');
  if(currentView==='dashboard') m.innerHTML=renderDashboard();
  else if(currentView==='projects') m.innerHTML=renderProjects();
  else if(currentView==='project-detail') m.innerHTML=renderProjectDetail();
  else if(currentView==='leads') m.innerHTML=renderLeads();
  else if(currentView==='calendar') m.innerHTML=renderCalendar();
  else if(currentView==='ideas') m.innerHTML=renderIdeas();
  else if(currentView==='team') m.innerHTML=renderTeam();
  else if(currentView==='contacts') m.innerHTML=renderContacts();
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const active=store.projects.filter(p=>p.status==='active').length;
  const totalBudget=store.projects.reduce((s,p)=>s+p.budget,0);
  const totalSpent=store.projects.reduce((s,p)=>s+p.spent,0);

  return `
    <div class="topbar"><div><div class="page-title">Good morning, Adam.</div><div class="page-sub">Here's what's happening at FELT.</div></div><div class="storage-badge">● Saved</div></div>
    <div class="content">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">Projects</div><div class="stat-value">${store.projects.length}</div><div class="stat-sub">${active} active</div></div>
        <div class="stat-card"><div class="stat-label">Leads</div><div class="stat-value">${store.leads.length}</div><div class="stat-sub">${hotLeads} in progress</div></div>
        <div class="stat-card"><div class="stat-label">Budget</div><div class="stat-value">£${(totalBudget/1000).toFixed(0)}k</div><div class="stat-sub">Total across projects</div></div>
        <div class="stat-card"><div class="stat-label">Spent</div><div class="stat-value">£${(totalSpent/1000).toFixed(0)}k</div><div class="stat-sub">${totalBudget>0?Math.round(totalSpent/totalBudget*100):0}% of budget</div></div>
      </div>
      <div class="section-header"><div class="section-title">Active Projects</div><button class="btn btn-ghost btn-sm" onclick="navigate('projects')">View all</button></div>
      <div class="projects-grid">${store.projects.slice(0,4).map(p=>renderProjectCard(p)).join('')}</div>
    </div>`;
}

// ─── PROJECTS ─────────────────────────────────────────────────────────────────
function renderProjects() {
  return `
    <div class="topbar"><div><div class="page-title">Projects</div><div class="page-sub">${store.projects.length} projects total</div></div><button class="btn btn-primary" onclick="openNewProjectModal()">+ New</button></div>
    <div class="content"><div class="projects-grid">${store.projects.map(p=>renderProjectCard(p)).join('')}</div></div>`;
}

function signoffProgress(p) {
  if(!p.signoff) return 0;
  return SIGNOFF_STEPS.filter(s=>p.signoff[s.id]?.completed).length;
}

function renderProjectCard(p) {
  const pct=p.budget>0?Math.round(p.spent/p.budget*100):0;
  const teamInitials=p.teamIds.slice(0,3).map(id=>{const m=store.team.find(t=>t.id===id);return m?`<div class="team-avatar-sm">${initials(m.name)}</div>`:''}).join('');
  const soProgress=signoffProgress(p);
  const soTotal=SIGNOFF_STEPS.length;
  return `
    <div class="project-card status-${p.status}" onclick="navigate('project-detail',${p.id})">
      <div class="project-header"><div style="min-width:0"><div class="project-name">${p.name}</div><div class="project-client">${p.client}</div></div><div class="status-badge badge-${p.status}">${p.status}</div></div>
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px"><span>Budget</span><span>£${p.spent.toLocaleString()} / £${p.budget.toLocaleString()}</span></div>
        <div class="budget-bar"><div class="budget-bar-fill ${pct>100?'over':''}" style="width:${Math.min(pct,100)}%"></div></div>
      </div>
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px"><span>Sign-off</span><span>${soProgress} / ${soTotal}</span></div>
        <div class="budget-bar"><div class="budget-bar-fill" style="width:${Math.round(soProgress/soTotal*100)}%;background:var(--accent)"></div></div>
      </div>
      <div class="project-meta">
        <div class="meta-item"><strong>${p.type}</strong>Type</div>
        <div class="meta-item"><strong>${formatDate(p.endDate)}</strong>Deadline</div>
        <div class="meta-item" style="margin-left:auto"><div class="team-avatars">${teamInitials}</div></div>
      </div>
    </div>`;
}

// ─── PROJECT DETAIL ───────────────────────────────────────────────────────────
function renderProjectDetail() {
  const p=currentProject; if(!p) return '';
  return `
    <div class="topbar"><div><div class="back-btn" onclick="navigate('projects')">← Projects</div><div class="page-title">${p.name}</div><div class="page-sub">${p.client} · <span class="status-badge badge-${p.status}">${p.status}</span></div></div><button class="btn btn-ghost btn-sm" onclick="openEditProjectModal()">Edit</button></div>

      <div class="tabs">
        <div class="tab ${currentTab==='brief'?'active':''}" onclick="switchTab('brief')">Brief</div>

        <div class="tab ${currentTab==='budget'?'active':''}" onclick="switchTab('budget')">Budget</div>
        <div class="tab ${currentTab==='contacts'?'active':''}" onclick="switchTab('contacts')">Contacts</div>
      </div>
      ${currentTab==='brief'?renderBriefTab(p):''}
      ${currentTab==='signoff'?renderSignoffTab(p):''}
      ${currentTab==='team'?renderTeamTab(p):''}
      ${currentTab==='budget'?renderBudgetTab(p):''}
      ${currentTab==='contacts'?renderContactsTab(p):''}
    </div>`;
}

function switchTab(tab){currentTab=tab;render();}

// ─── SIGN-OFF TAB ─────────────────────────────────────────────────────────────
function renderSignoffTab(p) {
  if(!p.signoff) p.signoff=emptySignoff();
  const completed=SIGNOFF_STEPS.filter(s=>p.signoff[s.id]?.completed).length;
  const total=SIGNOFF_STEPS.length;
  const pct=Math.round(completed/total*100);
  const nextStep=SIGNOFF_STEPS.find(s=>!p.signoff[s.id]?.completed);
  const allDone=completed===total;

  return `
    <div class="signoff-header">
      <div class="signoff-progress-label">
        <div class="signoff-progress-text">${allDone?'✓ All stages complete':completed+' of '+total+' stages complete'}</div>
        <div class="signoff-progress-pct">${pct}%</div>
      </div>
      <div class="signoff-bar"><div class="signoff-bar-fill" style="width:${pct}%"></div></div>
      ${!allDone&&nextStep?`<div class="signoff-current">Next up: <strong>${nextStep.label}</strong></div>`:''}
    </div>

    <div class="signoff-list">
      ${SIGNOFF_STEPS.map((step, i) => {
        const data = p.signoff[step.id] || {};
        const isDone = data.completed;
        const isNext = !isDone && SIGNOFF_STEPS.slice(0,i).every(s=>p.signoff[s.id]?.completed);
        const stateClass = isDone ? 'completed' : isNext ? 'current' : 'future';
        const iconClass = isDone ? 'done' : isNext ? 'next' : 'pending';
        const iconChar = isDone ? '✓' : (i+1);

        return `
          <div class="signoff-step ${stateClass}">
            <div class="signoff-icon ${iconClass}">${iconChar}</div>
            <div class="signoff-step-info">
              <div class="signoff-step-label">${step.label}</div>
              ${isDone ? `<div class="signoff-step-meta"><strong>${data.completedBy}</strong> · ${formatDate(data.completedAt)}</div>` : ''}
              ${isNext ? `<div class="signoff-step-meta">Ready to sign off</div>` : ''}
            </div>
            <div class="signoff-actions">
              ${isDone ? `<button class="btn btn-ghost btn-sm" onclick="undoSignoff('${step.id}')">Undo</button>` : ''}
              ${isNext ? `<button class="btn btn-green btn-sm" onclick="openSignoffModal('${step.id}')">Sign Off</button>` : ''}
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

function openSignoffModal(stepId) {
  const step = SIGNOFF_STEPS.find(s=>s.id===stepId);
  const memberNames = store.team.map(m=>`<option>${m.name}</option>`).join('');
  openModal(`
    <div class="modal-title">Sign Off: ${step.label}</div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Signed off by</label>
        <select id="so-name">
          <option value="">— Select —</option>
          ${memberNames}
          <option value="Adam">Adam</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group full" id="so-other-wrap" style="display:none">
        <label>Name</label>
        <input id="so-other" placeholder="Enter name">
      </div>
      <div class="form-group full">
        <label>Date</label>
        <input id="so-date" type="date" value="${new Date().toISOString().split('T')[0]}">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" onclick="confirmSignoff('${stepId}')">Confirm Sign Off</button>
    </div>`);
  document.getElementById('so-name').addEventListener('change', function() {
    document.getElementById('so-other-wrap').style.display = this.value==='Other' ? 'flex' : 'none';
  });
}

function confirmSignoff(stepId) {
  const nameEl = document.getElementById('so-name');
  let name = nameEl.value;
  if (name==='Other') name = document.getElementById('so-other').value.trim();
  if (!name) { toast('Please select a name'); return; }
  const date = document.getElementById('so-date').value;
  const p = currentProject;
  if (!p.signoff) p.signoff = emptySignoff();
  p.signoff[stepId] = { completed: true, completedBy: name, completedAt: date };
  closeModal();
  save();
  toast('✓ Signed off');
  render();
}

function undoSignoff(stepId) {
  const p = currentProject;
  if (p.signoff) p.signoff[stepId] = { completed: false, completedBy: '', completedAt: '' };
  save();
  toast('Sign-off removed');
  render();
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function renderCalendar() {
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const firstDay=new Date(calYear,calMonth,1),lastDay=new Date(calYear,calMonth+1,0);
  const startDow=(firstDay.getDay()+6)%7,totalDays=lastDay.getDate();
  const today=new Date();
  let cells=[];
  for(let i=0;i<startDow;i++) cells.push({date:new Date(calYear,calMonth,-startDow+i+1),thisMonth:false});
  for(let d=1;d<=totalDays;d++) cells.push({date:new Date(calYear,calMonth,d),thisMonth:true});
  while(cells.length%7!==0){const last=cells[cells.length-1].date;cells.push({date:new Date(last.getFullYear(),last.getMonth(),last.getDate()+1),thisMonth:false});}
  const sc={active:'ev-active',planning:'ev-planning',pitched:'ev-pitched',completed:'ev-completed'};
  const dc={active:'var(--green)',planning:'var(--accent)',pitched:'var(--blue)',completed:'var(--muted)'};
  function renderCell(cell) {
    const isToday=cell.thisMonth&&cell.date.getDate()===today.getDate()&&cell.date.getMonth()===today.getMonth()&&cell.date.getFullYear()===today.getFullYear();
    const events=store.projects.filter(p=>{if(!p.startDate||!p.endDate)return false;return cell.date>=new Date(p.startDate)&&cell.date<=new Date(p.endDate);});
    const evHtml=events.slice(0,2).map(p=>{const isStart=cell.date.toDateString()===new Date(p.startDate).toDateString();return`<div class="cal-event ${sc[p.status]||''}" onclick="event.stopPropagation();navigate('project-detail',${p.id})">${isStart?p.name.split('—')[0].trim():'·'}</div>`;}).join('');
    return`<div class="cal-day ${!cell.thisMonth?'other-month':''} ${isToday?'today':''}"><div class="cal-day-num">${cell.date.getDate()}</div>${evHtml}</div>`;
  }
  const sorted=[...store.projects].filter(p=>p.startDate||p.endDate).sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));
  return `
    <div class="topbar"><div><div class="page-title">Calendar</div><div class="page-sub">Project timeline overview</div></div></div>
    <div class="content">
      <div class="cal-nav"><button class="btn btn-ghost btn-sm" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}render()">← Prev</button><div class="cal-month">${monthNames[calMonth]} ${calYear}</div><button class="btn btn-ghost btn-sm" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}render()">Next →</button></div>
      <div class="cal-grid"><div class="cal-header">${days.map(d=>`<div class="cal-header-cell">${d}</div>`).join('')}</div><div class="cal-body">${cells.map(c=>renderCell(c)).join('')}</div></div>
      <div class="section-header"><div class="section-title">All Projects</div></div>
      <div class="cal-list">${sorted.map(p=>`<div class="cal-list-item" onclick="navigate('project-detail',${p.id})"><div class="cal-dot" style="background:${dc[p.status]||'var(--muted)'}"></div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${p.name}</div><div style="font-size:12px;color:var(--muted)">${p.client}</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:12px;font-weight:600">${formatDate(p.startDate)}</div><div style="font-size:11px;color:var(--muted)">→ ${formatDate(p.endDate)}</div></div><div class="status-badge badge-${p.status}">${p.status}</div></div>`).join('')}</div>
    </div>`;
}

// ─── MODALS ───────────────────────────────────────────────────────────────────
function openModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function closeModalOutside(e){if(e.target===document.getElementById('modal'))closeModal();}
function statusOpts(sel){return LEAD_STATUSES.map(s=>`<option value="${s.key}" ${sel===s.key?'selected':''}>${s.label}</option>`).join('');}

function openNewIdeaModal(){const mn=store.team.map(m=>`<option>${m.name}</option>`).join('');openModal(`<div class="modal-title">✦ New Idea</div><div class="form-grid"><div class="form-group full"><label>Idea Title</label><input id="i-title" placeholder="Give it a name..."></div><div class="form-group"><label>Category</label><select id="i-cat"><option>Brand</option><option>Event</option><option>Space</option><option>Print</option><option>Digital</option><option>Product</option><option>Other</option></select></div><div class="form-group"><label>Submitted By</label><select id="i-by"><option value="">— Select —</option>${mn}<option value="Other">Other</option></select></div><div class="form-group full"><label>Description</label><textarea id="i-desc" placeholder="Describe the idea — no filter needed..."></textarea></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createIdea()">Add Idea</button></div>`);}
function createIdea(){const t=document.getElementById('i-title').value.trim();if(!t){toast('Give the idea a title');return;}store.ideas.unshift({id:store.nextId.ideas++,title:t,category:document.getElementById('i-cat').value,description:document.getElementById('i-desc').value,submittedBy:document.getElementById('i-by').value||'Anonymous',date:new Date().toISOString().split('T')[0]});closeModal();toast('Idea added ✦');save();render();}
function deleteIdea(id){store.ideas=store.ideas.filter(i=>i.id!==id);toast('Idea removed');save();render();}

function openNewLeadModal(){openModal(`<div class="modal-title">Add Lead</div><div class="form-grid"><div class="form-group"><label>Company</label><input id="l-company" placeholder="Company name"></div><div class="form-group"><label>Contact Name</label><input id="l-contact"></div><div class="form-group"><label>Contact Email</label><input id="l-email" type="email"></div><div class="form-group"><label>Project Type</label><select id="l-type"><option>Brand Activation</option><option>Pop-Up</option><option>Branding</option><option>Event</option><option>Creative Project</option><option>Other</option></select></div><div class="form-group"><label>Estimated Value (£)</label><input id="l-value" type="number" placeholder="0"></div><div class="form-group"><label>Status</label><select id="l-status">${statusOpts('not-contacted')}</select></div><div class="form-group full"><label>Notes & Next Steps</label><textarea id="l-notes"></textarea></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createLead()">Add Lead</button></div>`);}
function createLead(){const c=document.getElementById('l-company').value.trim();if(!c){toast('Company name required');return;}store.leads.push({id:store.nextId.leads++,company:c,contactName:document.getElementById('l-contact').value,contactEmail:document.getElementById('l-email').value,projectType:document.getElementById('l-type').value,estimatedValue:parseInt(document.getElementById('l-value').value)||0,status:document.getElementById('l-status').value,notes:document.getElementById('l-notes').value});closeModal();toast('Lead added');save();render();}
function openEditLeadModal(id){const l=store.leads.find(x=>x.id===id);openModal(`<div class="modal-title">Edit Lead</div><div class="form-grid"><div class="form-group"><label>Company</label><input id="l-company" value="${l.company}"></div><div class="form-group"><label>Contact Name</label><input id="l-contact" value="${l.contactName}"></div><div class="form-group"><label>Contact Email</label><input id="l-email" value="${l.contactEmail}"></div><div class="form-group"><label>Project Type</label><select id="l-type">${['Brand Activation','Pop-Up','Branding','Event','Creative Project','Other'].map(t=>`<option ${l.projectType===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-group"><label>Estimated Value (£)</label><input id="l-value" type="number" value="${l.estimatedValue||0}"></div><div class="form-group"><label>Status</label><select id="l-status">${statusOpts(l.status)}</select></div><div class="form-group full"><label>Notes & Next Steps</label><textarea id="l-notes">${l.notes||''}</textarea></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveLead(${id})">Save</button></div>`);}
function saveLead(id){const l=store.leads.find(x=>x.id===id);l.company=document.getElementById('l-company').value.trim()||l.company;l.contactName=document.getElementById('l-contact').value;l.contactEmail=document.getElementById('l-email').value;l.projectType=document.getElementById('l-type').value;l.estimatedValue=parseInt(document.getElementById('l-value').value)||0;l.status=document.getElementById('l-status').value;l.notes=document.getElementById('l-notes').value;closeModal();toast('Lead saved');save();render();}
function deleteLead(id){store.leads=store.leads.filter(l=>l.id!==id);toast('Lead removed');save();render();}

function openNewProjectModal(){openModal(`<div class="modal-title">New Project</div><div class="form-grid"><div class="form-group full"><label>Project Name</label><input id="f-name" placeholder="e.g. Summer Pop-Up"></div><div class="form-group"><label>Client</label><input id="f-client"></div><div class="form-group"><label>Type</label><select id="f-type"><option>Brand Activation</option><option>Pop-Up</option><option>Branding</option><option>Creative Project</option><option>Event</option><option>Other</option></select></div><div class="form-group"><label>Status</label><select id="f-status"><option value="planning">Planning</option><option value="active">Active</option><option value="pitched">Pitched</option><option value="completed">Completed</option></select></div><div class="form-group"><label>Budget (£)</label><input id="f-budget" type="number" placeholder="0"></div><div class="form-group"></div><div class="form-group"><label>Start Date</label><input id="f-start" type="date"></div><div class="form-group"><label>End Date</label><input id="f-end" type="date"></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createProject()">Create Project</button></div>`);}

function openEditBriefModal(){const p=currentProject;openModal(`<div class="modal-title">Edit Brief</div><div class="form-grid"><div class="form-group full"><label>Overview</label><textarea id="b-overview">${p.brief.overview}</textarea></div><div class="form-group full"><label>Objectives</label><textarea id="b-objectives">${p.brief.objectives}</textarea></div><div class="form-group full"><label>Deliverables</label><textarea id="b-deliverables">${p.brief.deliverables}</textarea></div><div class="form-group full"><label>Timeline Notes</label><textarea id="b-timeline">${p.brief.timeline}</textarea></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveBrief()">Save Brief</button></div>`);}

function openAllocateModal(){const p=currentProject;const av=store.team.filter(m=>!p.teamIds.includes(m.id));openModal(`<div class="modal-title">Allocate Team Member</div>${av.length===0?'<p style="color:var(--muted)">All team members already assigned.</p>':`<div class="form-grid"><div class="form-group"><label>Team Member</label><select id="f-member">${av.map(m=>`<option value="${m.id}">${m.name} — ${m.role} (£${m.rate}/day)</option>`).join('')}</select></div><div class="form-group"><label>Days Allocated</label><input id="f-days" type="number" value="1" min="0"></div></div>`}<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>${av.length>0?`<button class="btn btn-primary" onclick="allocateMember()">Add to Project</button>`:''}</div>`);}
function allocateMember(){const mid=parseInt(document.getElementById('f-member').value),days=parseInt(document.getElementById('f-days').value)||0,p=currentProject;p.teamIds.push(mid);if(!p.teamAllocation)p.teamAllocation={};p.teamAllocation[mid]=days;closeModal();toast('Team member added');save();render();}
function removeTeamMember(id){const p=currentProject;p.teamIds=p.teamIds.filter(t=>t!==id);if(p.teamAllocation)delete p.teamAllocation[id];toast('Removed');save();render();}
function openAddExpenseModal(){openModal(`<div class="modal-title">Add Expense</div><div class="form-grid"><div class="form-group full"><label>Description</label><input id="f-desc" placeholder="e.g. Venue hire"></div><div class="form-group"><label>Category</label><select id="f-cat"><option>Venue</option><option>Production</option><option>Staffing</option><option>Tech</option><option>Design</option><option>Travel</option><option>Other</option></select></div><div class="form-group"><label>Amount (£)</label><input id="f-amount" type="number" placeholder="0"></div><div class="form-group"><label>Date</label><input id="f-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addExpense()">Add Expense</button></div>`);}
function addExpense(){const a=parseFloat(document.getElementById('f-amount').value)||0,d=document.getElementById('f-desc').value.trim();if(!d){toast('Description required');return;}const p=currentProject;p.expenses.push({id:store.nextId.expenses++,description:d,category:document.getElementById('f-cat').value,amount:a,date:document.getElementById('f-date').value});p.spent=p.expenses.reduce((s,e)=>s+e.amount,0);closeModal();toast('Expense added');save();render();}
function deleteExpense(id){const p=currentProject;p.expenses=p.expenses.filter(e=>e.id!==id);p.spent=p.expenses.reduce((s,e)=>s+e.amount,0);toast('Removed');save();render();}
function openAddContactToProjectModal(){const p=currentProject,av=store.contacts.filter(c=>!p.contactIds.includes(c.id));openModal(`<div class="modal-title">Add Contact</div>${av.length===0?'<p style="color:var(--muted)">All contacts already linked.</p>':`<div class="form-group"><label>Select Contact</label><select id="f-contact">${av.map(c=>`<option value="${c.id}">${c.name} — ${c.company}</option>`).join('')}</select></div>`}<div style="margin-top:10px;font-size:12px;color:var(--muted)">Don't see them? <a onclick="closeModal();navigate('contacts')" style="color:var(--blue);cursor:pointer">Add to contacts first.</a></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>${av.length>0?`<button class="btn btn-primary" onclick="addContactToProject()">Add</button>`:''}</div>`);}
function addContactToProject(){currentProject.contactIds.push(parseInt(document.getElementById('f-contact').value));closeModal();toast('Contact added');save();render();}
function removeContact(id){currentProject.contactIds=currentProject.contactIds.filter(c=>c!==id);toast('Removed');save();render();}
function openNewMemberModal(){openModal(`<div class="modal-title">Add Team Member</div><div class="form-grid"><div class="form-group"><label>Full Name</label><input id="f-name"></div><div class="form-group"><label>Role</label><input id="f-role" placeholder="e.g. Designer"></div><div class="form-group"><label>Email</label><input id="f-email" type="email"></div><div class="form-group"><label>Day Rate (£)</label><input id="f-rate" type="number" placeholder="0"></div><div class="form-group full"><label>Skills (comma separated)</label><input id="f-skills"></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createMember()">Add Member</button></div>`);}
function createMember(){const n=document.getElementById('f-name').value.trim();if(!n){toast('Name required');return;}store.team.push({id:store.nextId.team++,name:n,role:document.getElementById('f-role').value||'Freelancer',email:document.getElementById('f-email').value,rate:parseInt(document.getElementById('f-rate').value)||0,skills:document.getElementById('f-skills').value.split(',').map(s=>s.trim()).filter(Boolean)});closeModal();toast('Team member added');save();render();}
function openEditMemberModal(id){const m=store.team.find(t=>t.id===id);openModal(`<div class="modal-title">Edit Team Member</div><div class="form-grid"><div class="form-group"><label>Full Name</label><input id="f-name" value="${m.name}"></div><div class="form-group"><label>Role</label><input id="f-role" value="${m.role}"></div><div class="form-group"><label>Email</label><input id="f-email" value="${m.email}"></div><div class="form-group"><label>Day Rate (£)</label><input id="f-rate" type="number" value="${m.rate}"></div><div class="form-group full"><label>Skills (comma separated)</label><input id="f-skills" value="${m.skills.join(', ')}"></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveMember(${id})">Save</button></div>`);}
function saveMember(id){const m=store.team.find(t=>t.id===id);m.name=document.getElementById('f-name').value.trim()||m.name;m.role=document.getElementById('f-role').value;m.email=document.getElementById('f-email').value;m.rate=parseInt(document.getElementById('f-rate').value)||0;m.skills=document.getElementById('f-skills').value.split(',').map(s=>s.trim()).filter(Boolean);closeModal();toast('Saved');save();render();}
function deleteMember(id){store.team=store.team.filter(m=>m.id!==id);toast('Removed');save();render();}
function openNewContactModal(){openModal(`<div class="modal-title">Add Contact</div><div class="form-grid"><div class="form-group"><label>Full Name</label><input id="f-name"></div><div class="form-group"><label>Company</label><input id="f-company"></div><div class="form-group"><label>Role</label><input id="f-role"></div><div class="form-group"><label>Email</label><input id="f-email" type="email"></div><div class="form-group"><label>Phone</label><input id="f-phone"></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createContact()">Add Contact</button></div>`);}
function createContact(){const n=document.getElementById('f-name').value.trim();if(!n){toast('Name required');return;}store.contacts.push({id:store.nextId.contacts++,name:n,company:document.getElementById('f-company').value,role:document.getElementById('f-role').value,email:document.getElementById('f-email').value,phone:document.getElementById('f-phone').value});closeModal();toast('Contact added');save();render();}
function openEditContactModal(id){const c=store.contacts.find(x=>x.id===id);openModal(`<div class="modal-title">Edit Contact</div><div class="form-grid"><div class="form-group"><label>Full Name</label><input id="f-name" value="${c.name}"></div><div class="form-group"><label>Company</label><input id="f-company" value="${c.company}"></div><div class="form-group"><label>Role</label><input id="f-role" value="${c.role}"></div><div class="form-group"><label>Email</label><input id="f-email" value="${c.email}"></div><div class="form-group"><label>Phone</label><input id="f-phone" value="${c.phone}"></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveContact(${id})">Save</button></div>`);}
function saveContact(id){const c=store.contacts.find(x=>x.id===id);c.name=document.getElementById('f-name').value.trim()||c.name;c.company=document.getElementById('f-company').value;c.role=document.getElementById('f-role').value;c.email=document.getElementById('f-email').value;c.phone=document.getElementById('f-phone').value;closeModal();toast('Saved');save();render();}
function deleteContact(id){store.contacts=store.contacts.filter(c=>c.id!==id);toast('Removed');save();render();}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function initials(name){return name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);}
function formatDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

render();
</script>
</body>
</html>
