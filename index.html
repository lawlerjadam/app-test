<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>FELT — Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #FAFAF7; --surface: #FFFFFF; --border: #E8E8DC; --text: #0F1F35; --muted: #7A7570;
    --accent: #EDD060; --accent-dark: #C8A830; --accent-light: #FBF5D8;
    --navy: #0F1F35; --blue: #7B9FD4; --blue-light: #DDEAF8;
    --green: #5EAF80; --green-light: #D0EEE0; --red: #C96060; --red-light: #F5DADA;
    --purple: #9B7FD4; --purple-light: #EDE5F8;
    --orange: #C8844A; --orange-light: #F5E0CC;
    --radius: 10px; --sidebar-w: 230px; --bottom-nav-h: 64px; --mobile-header-h: 52px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }

  .sidebar { width: var(--sidebar-w); background: #F2F2E8; border-right: 1.5px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; padding: 0 0 24px; z-index: 20; }
  .sidebar-logo { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .sidebar-logo img { width: 80px; display: block; }
  .nav-section { padding: 0 10px; margin-bottom: 2px; }
  .nav-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 10px 12px 5px; font-weight: 600; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13.5px; transition: all 0.15s; user-select: none; }
  .nav-item:hover { background: var(--border); color: var(--text); }
  .nav-item.active { background: var(--accent); color: var(--navy); font-weight: 700; }
  .nav-item .icon { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
  .sidebar-footer { margin-top: auto; padding: 0 10px; }
  .user-chip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: var(--muted); font-size: 13px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--navy); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  .mobile-header { display: none; position: fixed; top: 0; left: 0; right: 0; height: calc(var(--mobile-header-h) + env(safe-area-inset-top, 0px)); background: #F2F2E8; border-bottom: 1.5px solid var(--border); z-index: 45; align-items: flex-end; padding: 0 16px env(safe-area-inset-top, 0px); justify-content: space-between; padding-top: env(safe-area-inset-top, 0px); }
  .mobile-header img { height: 28px; display: block; cursor: pointer; }

  .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px)); background: var(--navy); z-index: 50; align-items: center; justify-content: space-around; padding: 0 4px env(safe-area-inset-bottom, 0px); border-top: 1px solid rgba(255,255,255,0.08); }
  .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 6px; cursor: pointer; color: rgba(255,255,255,0.45); font-size: 10px; transition: all 0.15s; min-width: 44px; }
  .bottom-nav-item .bn-icon { font-size: 18px; line-height: 1; }
  .bottom-nav-item.active { color: var(--accent); }
  #mobile-tray-backdrop { display:none; position:fixed; inset:0; bottom:calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px)); z-index:48; }
  #mobile-tray-backdrop.open { display:block; }
  #mobile-tray { display:none; position:fixed; bottom:calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px)); left:0; right:0; background:var(--navy); z-index:49; padding:10px 8px 6px; border-top:1px solid rgba(255,255,255,0.12); border-radius:16px 16px 0 0; flex-wrap:wrap; gap:4px; }
  #mobile-tray.open { display:flex; }
  .tray-item { display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 8px; border-radius:10px; cursor:pointer; color:rgba(255,255,255,0.6); font-size:11px; flex:1; min-width:60px; transition:all 0.15s; }
  .tray-item:active { background:rgba(255,255,255,0.08); }
  .tray-item.active { color:var(--accent); }
  .tray-item .ti { font-size:20px; line-height:1; }

  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: var(--bg); padding: 22px 28px 0; display: flex; align-items: flex-start; justify-content: space-between; position: sticky; top: 0; z-index: 10; gap: 12px; }
  .page-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
  .btn-primary { background: var(--accent); color: var(--navy); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
  .btn-ghost:hover { background: var(--surface); color: var(--text); }
  .btn-green { background: var(--green); color: #fff; border: none; }
  .btn-green:hover { background: #15803d; }
  .btn-red { background: var(--red); color: #fff; border: none; }
  .btn-sm { padding: 5px 11px; font-size: 12px; }

  .content { padding: 20px 28px 40px; }
  .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -1px; color: var(--navy); }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden; }
  .project-card:hover { box-shadow: 0 4px 20px rgba(15,31,53,0.1); transform: translateY(-1px); }
  .project-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--project-color, var(--blue)); }
  .project-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
  .project-name { font-size: 14px; font-weight: 700; }
  .project-client { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .status-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .badge-active { background: var(--green-light); color: var(--green); }
  .badge-planning { background: var(--accent-light); color: #92700A; }
  .badge-completed { background: #f0f0f0; color: var(--muted); }
  .badge-pitched { background: var(--blue-light); color: var(--blue); }
  .badge-not-contacted { background: #f0f0f0; color: var(--muted); }
  .badge-reached-out { background: var(--accent-light); color: #92700A; }
  .badge-in-conversation { background: var(--blue-light); color: var(--blue); }
  .badge-proposal-sent { background: var(--purple-light); color: var(--purple); }
  .badge-won { background: var(--green-light); color: var(--green); }
  .badge-lost { background: var(--red-light); color: var(--red); }
  .badge-converted { background: var(--navy); color: var(--accent); }
  .badge-confirmed { background: var(--green-light); color: var(--green); }
  .badge-pending { background: var(--accent-light); color: #92700A; }
  .badge-cancelled { background: var(--red-light); color: var(--red); }
  .badge-needed { background: #f0f0f0; color: var(--muted); }
  .badge-on-site { background: var(--blue-light); color: var(--blue); }
  .badge-returned { background: var(--green-light); color: var(--green); }
  .badge-available { background: var(--green-light); color: var(--green); }
  .badge-busy { background: var(--accent-light); color: #92700A; }
  .badge-away { background: var(--red-light); color: var(--red); }
  .badge-signed { background: var(--green-light); color: var(--green); }
  .badge-not-sent { background: #f0f0f0; color: var(--muted); }
  .badge-sent { background: var(--blue-light); color: var(--blue); }
  .badge-expired { background: var(--red-light); color: var(--red); }
  .badge-outside { background: var(--green-light); color: var(--green); }
  .badge-inside { background: var(--orange-light); color: var(--orange); }
  .badge-not-assessed { background: #f0f0f0; color: var(--muted); }
  .badge-paid { background: var(--green-light); color: var(--green); }
  .badge-pending { background: var(--accent-light); color: #92700A; }
  .badge-overdue { background: var(--red-light); color: var(--red); }

  .member-profile-header { background: var(--navy); border-radius: var(--radius); padding: 24px; display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
  .member-avatar-xl { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--navy); font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .member-profile-name { font-size: 20px; font-weight: 800; color: #fff; }
  .member-profile-role { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 3px; }
  .member-profile-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .crm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  .crm-stat { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .crm-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 5px; font-weight: 700; }
  .crm-stat-value { font-size: 18px; font-weight: 800; color: var(--navy); }
  .payment-total-row { display: flex; gap: 14px; margin-bottom: 18px; }
  .payment-total { flex: 1; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; text-align: center; }
  .payment-total-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .payment-total-value { font-size: 20px; font-weight: 800; color: var(--navy); }
  .payment-total-value.pending-val { color: var(--orange); }
  .payment-total-value.overdue-val { color: var(--red); }

  .project-meta { display: flex; gap: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .meta-item { font-size: 11px; color: var(--muted); }
  .meta-item strong { color: var(--text); display: block; font-size: 12px; font-weight: 600; }
  .budget-bar { height: 5px; background: var(--border); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .budget-bar-fill { height: 100%; border-radius: 3px; background: var(--green); }
  .budget-bar-fill.over { background: var(--red); }
  .team-avatars { display: flex; }
  .team-avatar-sm { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-light); color: var(--navy); font-size: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface); margin-right: -5px; }

  .back-btn { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; cursor: pointer; margin-bottom: 14px; width: fit-content; }
  .back-btn:hover { color: var(--text); }
  .tabs { display: flex; gap: 3px; margin-bottom: 18px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 4px; width: fit-content; overflow-x: auto; max-width: 100%; }
  .tab { padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); transition: all 0.15s; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--navy); color: var(--accent); font-weight: 700; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  input, textarea, select { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); transition: border 0.15s; outline: none; width: 100%; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: vertical; min-height: 90px; }

  .budget-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .budget-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .budget-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 5px; font-weight: 700; }
  .budget-value { font-size: 22px; font-weight: 800; color: var(--navy); }
  .budget-value.over { color: var(--red); }
  .budget-value.good { color: var(--green); }
  .budget-desktop-table { display: block; }
  .budget-mobile-cards { display: none; }
  .budget-forecast-val:hover { background: var(--accent-light); }

  .table-wrap { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; min-width: 400px; }
  .table th { text-align: left; padding: 9px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); border-bottom: 1.5px solid var(--border); font-weight: 700; }
  .table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .table tr:last-child td { border-bottom: none; }
  .table tr:hover td { background: var(--bg); }

  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .team-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .team-avatar-lg { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-light); color: var(--navy); font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; border: 2px solid var(--accent); }
  .team-name { font-size: 14px; font-weight: 700; }
  .team-role { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .team-rate { font-size: 13px; font-weight: 700; color: var(--blue); margin-top: 6px; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 8px; }
  .skill-tag { font-size: 10px; padding: 2px 7px; background: var(--navy); color: var(--accent); border-radius: 20px; font-weight: 700; }

  .contact-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .contact-row:last-child { border-bottom: none; }
  .contact-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue-light); color: var(--blue); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .contact-name { font-size: 14px; font-weight: 600; }
  .contact-detail { font-size: 12px; color: var(--muted); }
  .contact-actions { margin-left: auto; display: flex; gap: 6px; }

  .pipeline { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .pipeline-col { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
  .pipeline-col-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .pipeline-col-count { font-size: 24px; font-weight: 800; color: var(--navy); }
  .pipeline-col-value { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .lead-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .lead-row:last-child { border-bottom: none; }
  .lead-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-light); color: var(--navy); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .lead-name { font-size: 14px; font-weight: 700; }
  .lead-detail { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .lead-notes { font-size: 13px; color: var(--text); margin-top: 5px; line-height: 1.45; }
  .lead-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }

  /* ── SIGN-OFF ─────────────────────────────────────────── */
  .signoff-header { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .signoff-progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .signoff-progress-text { font-size: 13px; font-weight: 700; color: var(--navy); }
  .signoff-progress-pct { font-size: 12px; color: var(--muted); }
  .signoff-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .signoff-bar-fill { height: 100%; border-radius: 4px; background: var(--green); transition: width 0.4s; }
  .signoff-current { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .signoff-current strong { color: var(--navy); }
  .signoff-list { display: flex; flex-direction: column; gap: 6px; }
  .signoff-step { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; transition: all 0.15s; }
  .signoff-step.completed { border-color: var(--green-light); background: #FAFFFE; }
  .signoff-step.current { border-color: var(--accent); background: var(--accent-light); }
  .signoff-step.future { opacity: 0.55; }
  .signoff-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; }
  .signoff-icon.done { background: var(--green); color: #fff; }
  .signoff-icon.next { background: var(--accent); color: var(--navy); }
  .signoff-icon.pending { background: var(--border); color: var(--muted); }
  .signoff-step-info { flex: 1; min-width: 0; }
  .signoff-step-label { font-size: 14px; font-weight: 700; color: var(--navy); }
  .signoff-step-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .signoff-step-meta strong { color: var(--green); }
  .signoff-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* ── PRODUCTION ───────────────────────────────────────── */
  .prod-section { margin-bottom: 24px; }
  .prod-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
  .prod-day-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; gap: 16px; align-items: flex-start; position: relative; }
  .prod-day-date { background: var(--navy); color: var(--accent); border-radius: 8px; padding: 10px 12px; text-align: center; flex-shrink: 0; min-width: 58px; }
  .prod-day-date .day-num { font-size: 22px; font-weight: 800; line-height: 1; }
  .prod-day-date .day-mon { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .prod-day-info { flex: 1; min-width: 0; }
  .prod-day-location { font-size: 14px; font-weight: 700; }
  .prod-day-times { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .prod-day-notes { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.45; }
  .prod-days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .prod-remove { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 5px; }
  .prod-remove:hover { color: var(--red); }
  .callsheet-area { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .callsheet-textarea { width: 100%; border: none; background: transparent; font-size: 13px; font-family: inherit; color: var(--text); resize: vertical; min-height: 120px; outline: none; line-height: 1.6; }

  /* ── CALENDAR ─────────────────────────────────────────── */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-month { font-size: 18px; font-weight: 800; color: var(--navy); }
  .cal-grid { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 24px; }
  .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1.5px solid var(--border); }
  .cal-header-cell { padding: 8px 0; text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .cal-body { display: grid; grid-template-columns: repeat(7, 1fr); }
  /* ── Mobile calendar ── */
  .cal-mobile-view { display: none; }
  .cal-desktop-view { display: block; }
  .cal-week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-week-label { font-size: 15px; font-weight: 700; color: var(--navy); }
  .cal-week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 20px; background: var(--card); border-radius: 14px; padding: 10px 6px; border: 1.5px solid var(--border); }
  .cal-wd { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border-radius: 10px; }
  .cal-wd.today { background: var(--accent); }
  .cal-wd-name { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .cal-wd.today .cal-wd-name { color: var(--navy); }
  .cal-wd-num { font-size: 17px; font-weight: 800; color: var(--navy); margin-bottom: 5px; line-height: 1; }
  .cal-wd.today .cal-wd-num { color: var(--navy); }
  .cal-wd-dots { display: flex; gap: 2px; min-height: 5px; justify-content: center; }
  .cal-wd-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .cal-agenda-item { display: flex; gap: 10px; align-items: stretch; padding: 12px 14px; background: var(--card); border-radius: 12px; margin-bottom: 8px; cursor: pointer; border: 1.5px solid var(--border); transition: border-color 0.15s; }
  .cal-agenda-item:active { border-color: var(--accent); }
  .cal-agenda-accent { width: 4px; border-radius: 2px; flex-shrink: 0; }
  .cal-agenda-name { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
  .cal-agenda-meta { font-size: 12px; color: var(--muted); }

  .cal-day { min-height: 90px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; overflow: hidden; }
  .cal-day:nth-child(7n) { border-right: none; }
  .cal-day.other-month { background: var(--bg); }
  .cal-day.today { background: var(--accent-light); }
  .cal-day-num { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; line-height: 1; }
  .cal-day.today .cal-day-num { background: var(--accent); color: var(--navy); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .cal-event { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .cal-event.ev-active { background: var(--green-light); color: var(--green); }
  .cal-event.ev-planning { background: var(--accent-light); color: #92700A; }
  .cal-event.ev-pitched { background: var(--blue-light); color: var(--blue); }
  .cal-event.ev-completed { background: #f0f0f0; color: var(--muted); }
  .cal-list { display: flex; flex-direction: column; gap: 8px; }
  .cal-list-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.15s; }
  .cal-list-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .cal-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── IDEAS ────────────────────────────────────────────── */
  .ideas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .idea-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; position: relative; transition: all 0.15s; }
  .idea-card:hover { box-shadow: 0 4px 16px rgba(15,31,53,0.08); transform: translateY(-1px); }
  .idea-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); border-radius: var(--radius) var(--radius) 0 0; }
  .idea-category-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; width: fit-content; background: var(--navy); color: var(--accent); }
  .idea-title { font-size: 15px; font-weight: 800; color: var(--navy); line-height: 1.3; }
  .idea-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .idea-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border); margin-top: auto; }
  .idea-by { font-size: 11px; color: var(--muted); }
  .idea-by strong { color: var(--text); }

  .brief-content { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 22px; }
  .brief-section { margin-bottom: 20px; }
  .brief-section:last-child { margin-bottom: 0; }
  .brief-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 7px; font-weight: 700; }
  .brief-section-content { font-size: 14px; line-height: 1.65; color: var(--text); white-space: pre-wrap; }

  .allocate-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .allocate-row:last-child { border-bottom: none; }
  .allocate-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .section-title { font-size: 15px; font-weight: 800; color: var(--navy); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-state .empty-icon { font-size: 32px; margin-bottom: 10px; }
  .empty-state p { font-size: 13px; }
  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  .storage-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--green); background: var(--green-light); padding: 3px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15,31,53,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 16px; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border-radius: 14px; padding: 24px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; transform: translateY(12px); transition: transform 0.2s; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 18px; color: var(--navy); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  .toast { position: fixed; bottom: 80px; right: 20px; background: var(--navy); color: var(--accent); padding: 11px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; z-index: 200; transform: translateY(60px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── COLOUR SWATCHES ─────────────────────────────────────── */
  .color-swatches { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .color-swatch { width:28px; height:28px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:all 0.15s; flex-shrink:0; }
  .color-swatch:hover { transform:scale(1.15); }
  .color-swatch.selected { border-color: var(--navy); transform:scale(1.1); box-shadow:0 0 0 2px #fff inset; }

  /* ── GLOBAL SEARCH ────────────────────────────────────────── */
  .search-overlay { position:fixed; inset:0; background:rgba(15,31,53,0.75); z-index:300; display:none; align-items:flex-start; justify-content:center; padding-top:80px; }
  .search-overlay.open { display:flex; }
  .search-box { background:var(--surface); border-radius:14px; width:100%; max-width:600px; margin:0 16px; box-shadow:0 20px 60px rgba(0,0,0,0.3); overflow:hidden; }
  .search-input-row { padding:16px; border-bottom:1.5px solid var(--border); display:flex; align-items:center; gap:12px; }
  .search-input-row input { flex:1; border:none; background:transparent; font-size:16px; color:var(--text); outline:none; font-family:inherit; }
  .search-results { max-height:420px; overflow-y:auto; padding:8px; }
  .search-group-label { padding:8px 12px 4px; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
  .search-result { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; cursor:pointer; transition:background 0.1s; }
  .search-result:hover { background:var(--bg); }
  .search-result-type { font-size:11px; color:var(--muted); background:var(--bg); padding:2px 7px; border-radius:10px; font-weight:600; white-space:nowrap; }

  /* ── QUICK CAPTURE ────────────────────────────────────────── */
  #qc-btn { position:fixed; bottom:24px; right:24px; width:52px; height:52px; border-radius:50%; background:var(--accent); color:var(--navy); font-size:26px; font-weight:700; border:none; cursor:pointer; z-index:150; box-shadow:0 4px 20px rgba(240,192,64,0.45); transition:transform 0.2s; display:flex; align-items:center; justify-content:center; line-height:1; }
  #qc-btn:hover { box-shadow:0 6px 24px rgba(240,192,64,0.6); }
  #qc-menu { position:fixed; bottom:84px; right:24px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.12); z-index:149; padding:8px; display:none; flex-direction:column; gap:2px; min-width:180px; }
  .qc-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px; cursor:pointer; transition:background 0.1s; font-weight:600; font-size:13px; color:var(--text); }
  .qc-item:hover { background:var(--bg); }
  .qc-item .qc-icon { font-size:16px; width:20px; text-align:center; }
  @media (max-width:768px) {
    #qc-btn { display:none; }
    #qc-menu { bottom:calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px) + 12px); right:auto; left:50%; transform:translateX(-50%); }
    #qc-menu.open-mobile { display:flex; }
  }

  /* ── CLIENT SUMMARY ───────────────────────────────────────── */
  #summary-overlay { position:fixed; inset:0; background:#fff; z-index:400; overflow-y:auto; display:none; }
  .summary-inner { max-width:760px; margin:0 auto; padding:56px 48px 80px; }
  .summary-actions { position:fixed; top:20px; right:20px; display:flex; gap:8px; z-index:401; }
  @media print {
    .sidebar, .bottom-nav, #toast, .modal-overlay, #qc-btn, #qc-menu, .search-overlay, .summary-actions { display:none !important; }
    #summary-overlay { position:static !important; overflow:visible !important; }
    .main { display:none !important; }
    body { overflow:auto !important; height:auto !important; }
    .summary-inner { padding:20px !important; }
  }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { display: none; }
    .mobile-header { display: flex; }
    .bottom-nav { display: flex; }
    .main { flex: 1; padding-top: calc(var(--mobile-header-h) + env(safe-area-inset-top, 0px)); padding-bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px)); }
    .topbar { padding: 16px 16px 0; top: calc(var(--mobile-header-h) + env(safe-area-inset-top, 0px)); }
    .page-title { font-size: 18px; }
    .content { padding: 14px 16px 30px; }
    .stats-row { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-value { font-size: 22px; }
    .projects-grid { grid-template-columns: 1fr; }
    .team-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .cal-mobile-view { display: block; }
    .cal-desktop-view { display: none; }
    .ideas-grid { grid-template-columns: 1fr; }
    .budget-summary { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .budget-value { font-size: 16px; }
    .budget-desktop-table { display: none; }
    .budget-mobile-cards { display: block; }
    .pipeline { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .modal { padding: 20px; }
    .cal-day { min-height: 52px; padding: 4px; }
    .cal-event { display: none; }
    .tabs { width: 100%; }
    .tab { padding: 7px 8px; font-size: 11px; }
    .toast { bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px) + 12px); left: 16px; right: 16px; text-align: center; }
    .signoff-step { padding: 12px; gap: 10px; }
    .signoff-step-label { font-size: 13px; }
    .prod-days-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
// ─── PROJECT COLOURS ─────────────────────────────────────────────────────────
const PROJECT_COLORS = ['#C8844A','#7B9FD4','#9B7FD4','#C96060','#5EAF80','#5BA8C0','#C47AAA','#EDD060','#7FB85A','#A89FD4','#0F1F35','#9A9A8A'];

// ─── FEELING OF THE DAY ───────────────────────────────────────────────────────
const FEELINGS = [
  { word: 'Sonder', origin: 'The Dictionary of Obscure Sorrows', description: 'The realisation that each passerby has a life as vivid and complex as your own.' },
  { word: 'Hiraeth', origin: 'Welsh', description: 'A homesickness for somewhere you can\'t return to, or perhaps never was.' },
  { word: 'Forelsket', origin: 'Norwegian', description: 'The euphoria felt when falling in love for the first time.' },
  { word: 'Fernweh', origin: 'German', description: 'An ache for distant places; the craving to travel somewhere far away.' },
  { word: 'Sehnsucht', origin: 'German', description: 'A deep, bittersweet longing for something beautiful just out of reach.' },
  { word: 'Toska', origin: 'Russian', description: 'A dull ache of the soul — a longing with nothing to long for.' },
  { word: 'Meraki', origin: 'Greek', description: 'To put a piece of your soul into what you\'re doing; to do something with love.' },
  { word: 'Mudita', origin: 'Sanskrit', description: 'Pure joy at the happiness and good fortune of others.' },
  { word: 'Vorfreude', origin: 'German', description: 'The joyful, shivery anticipation of something wonderful yet to come.' },
  { word: 'Ikigai', origin: 'Japanese', description: 'A reason for being — the thing that makes you leap out of bed in the morning.' },
  { word: 'Mono no aware', origin: 'Japanese', description: 'A gentle sadness at the passing of things, and the beauty in impermanence.' },
  { word: 'Schadenfreude', origin: 'German', description: 'A small, guilty pleasure found in the misfortunes of others.' },
  { word: 'Querencia', origin: 'Spanish', description: 'A place from which one\'s strength is drawn — where you feel most yourself.' },
  { word: 'Hygge', origin: 'Danish', description: 'A quality of warmth and cosiness; the art of creating connection and comfort.' },
  { word: 'Mamihlapinatapai', origin: 'Yaghan', description: 'A look shared between two people, each wishing the other would start.' },
  { word: 'Dépaysement', origin: 'French', description: 'The disorientating thrill of being a stranger — somewhere you don\'t belong.' },
  { word: 'Chrysalism', origin: 'The Dictionary of Obscure Sorrows', description: 'The tranquil, amniotic calm of being indoors during a thunderstorm.' },
  { word: 'Vellichor', origin: 'The Dictionary of Obscure Sorrows', description: 'The strange wistfulness of used bookshops, as if they contain whole other lives.' },
  { word: 'Jouska', origin: 'The Dictionary of Obscure Sorrows', description: 'A hypothetical conversation you compulsively play out in your head.' },
  { word: 'Liberosis', origin: 'The Dictionary of Obscure Sorrows', description: 'The desire to care less about things — to loosen your grip on life.' },
  { word: 'Mauerbauertraurigkeit', origin: 'German', description: 'The inexplicable urge to push people away, even those you love.' },
  { word: 'Occhiolism', origin: 'The Dictionary of Obscure Sorrows', description: 'The awareness of how small your perspective is — and finding peace in it.' },
  { word: 'Ambedo', origin: 'The Dictionary of Obscure Sorrows', description: 'A trance where you become lost in a single sensory detail — rain on a window, a flickering light.' },
  { word: 'Frisson', origin: 'French', description: 'A sudden shiver of excitement or emotion — goosebumps from beauty.' },
  { word: 'Weltschmerz', origin: 'German', description: 'A weariness about the world — the pain of comparing reality with what it could be.' },
  { word: 'Resfeber', origin: 'Swedish', description: 'The restless mix of fear and excitement before a journey begins.' },
  { word: 'Cafuné', origin: 'Brazilian Portuguese', description: 'Tenderly running your fingers through someone\'s hair.' },
  { word: 'Wabi-Sabi', origin: 'Japanese', description: 'The bittersweet beauty found in imperfection, impermanence, and incompleteness.' },
  { word: 'Torschlusspanik', origin: 'German', description: 'The panic of doors closing — the fear that time is running out.' },
  { word: 'Pålegg', origin: 'Norwegian', description: 'Anything and everything you might put on a piece of bread — and the contentment in simplicity.' },
];

function openFeelingOfDay(random) {
  let feeling;
  if (random) {
    feeling = FEELINGS[Math.floor(Math.random() * FEELINGS.length)];
  } else {
    const day = new Date().toDateString();
    let hash = 0;
    for (let c of day) hash = (hash * 31 + c.charCodeAt(0)) % FEELINGS.length;
    feeling = FEELINGS[Math.abs(hash)];
  }
  document.getElementById('feeling-word').textContent = feeling.word;
  document.getElementById('feeling-origin').textContent = feeling.origin;
  document.getElementById('feeling-desc').textContent = feeling.description;
  document.getElementById('feeling-overlay').style.display = 'flex';
}

function closeFeelingOverlay() {
  document.getElementById('feeling-overlay').style.display = 'none';
}

let ffHistory = [], ffHistoryIdx = -1;

function openFutureFeels() {
  // Pick random, avoiding the one currently showing
  const current = ffHistory[ffHistoryIdx];
  const pool = FUTURE_FEELS.filter(f => f !== current);
  const f = pool[Math.floor(Math.random() * pool.length)];
  // Truncate any forward history then push
  ffHistory = ffHistory.slice(0, ffHistoryIdx + 1);
  ffHistory.push(f);
  ffHistoryIdx = ffHistory.length - 1;
  showFeel(f);
}

function goBackFutureFeels() {
  if (ffHistoryIdx > 0) { ffHistoryIdx--; showFeel(ffHistory[ffHistoryIdx]); }
}

function showFeel(f) {
  const palette = {
    lead:    {bg:'var(--blue-light)',  color:'var(--blue)'},
    idea:    {bg:'var(--purple-light)',color:'var(--purple)'},
    outreach:{bg:'var(--green-light)', color:'var(--green)'}
  };
  const p = palette[f.type];
  const badge = document.getElementById('ff-badge');
  badge.textContent = f.label;
  badge.style.background = p.bg;
  badge.style.color = p.color;
  document.getElementById('ff-title').textContent = f.company || f.title;
  document.getElementById('ff-detail').textContent = f.detail;
  document.getElementById('ff-action').textContent = f.action;
  const back = document.getElementById('ff-back');
  if (back) back.style.display = ffHistoryIdx > 0 ? '' : 'none';
  document.getElementById('ff-overlay').style.display = 'flex';
}

function closeFutureFeels() {
  document.getElementById('ff-overlay').style.display = 'none';
}

function save() { try { localStorage.setItem(STORAGE_KEY,JSON.stringify(store)); } catch(e){} }
const store = loadStore();

// Ensure nextId has all keys
if (!store.nextId.keyContacts) store.nextId.keyContacts = 10;
if (!store.nextId.contracts) store.nextId.contracts = 10;

// Migration: ensure all projects have signoff + production + color
store.projects.forEach((p,i) => {
  if (!p.signoff) p.signoff = emptySignoff();
  if (!p.production) p.production = emptyProduction();
  if (!p.production.keyContacts) p.production.keyContacts = [];
  if (!p.tasks) p.tasks = [];
  if (!p.assets) p.assets = {driveFolder:'', files:[]};

store.team.forEach(m => {

  tray.classList.add('open');

}

  mobileNavTray=null;

}

function navigate(view, projectId, memberId) {
  currentView=view;
  if(projectId!==undefined){currentProject=store.projects.find(p=>p.id===projectId);currentTab='brief';}
  if(memberId!==undefined){currentMember=store.team.find(m=>m.id===memberId);currentMemberTab='overview';}
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.bottom-nav-item').forEach(el=>el.classList.remove('active'));
  const navMap={snapshot:1,dashboard:2,projects:3,calendar:4,finance:5,team:6,contacts:7,'global-suppliers':8,leads:9,ideas:10};
  document.querySelectorAll('.nav-item')[navMap[view]]?.classList.add('active');
  const studioViews=['projects','project-detail','calendar','finance','snapshot'];
  const resourceViews=['team','team-profile','contacts','contact-profile','global-suppliers'];
  const futureViews=['leads','ideas'];
  const bnItems=document.querySelectorAll('.bottom-nav-item');
  if(studioViews.includes(view)) bnItems[1]?.classList.add('active');
  else if(resourceViews.includes(view)) bnItems[2]?.classList.add('active');
  else if(futureViews.includes(view)) bnItems[3]?.classList.add('active');
  else bnItems[0]?.classList.add('active');
  document.getElementById('main').scrollTo(0,0);
  render();
}

function render() {
  const m=document.getElementById('main');
  if(currentView==='snapshot') m.innerHTML=renderSnapshot();
  else if(currentView==='dashboard') m.innerHTML=renderDashboard();
  else if(currentView==='projects') m.innerHTML=renderProjects();
  else if(currentView==='project-detail') m.innerHTML=renderProjectDetail();
  else if(currentView==='leads') m.innerHTML=renderLeads();
  else if(currentView==='calendar') m.innerHTML=renderCalendar();
  else if(currentView==='ideas') m.innerHTML=renderIdeas();
  else if(currentView==='team') m.innerHTML=renderTeam();
  else if(currentView==='team-profile') m.innerHTML=renderTeamProfile();
  else if(currentView==='contacts') m.innerHTML=renderContacts();
  else if(currentView==='contact-profile') m.innerHTML=renderContactProfile();
  else if(currentView==='global-suppliers') m.innerHTML=renderGlobalSuppliers();
  else if(currentView==='finance') m.innerHTML=renderFinance();

  if(currentTab==='production') {

  }
}

// ─── SNAPSHOT ─────────────────────────────────────────────────────────────────
function renderSnapshot() {
  const year = new Date().getFullYear();
  const currentMonth = new Date().getMonth();
  const currentQ = Math.floor(currentMonth / 3) + 1;

  const quarters = [
    { q:1, label:'Q1', months:'Jan – Mar', start:new Date(year,0,1),  end:new Date(year,2,31)  },
    { q:2, label:'Q2', months:'Apr – Jun', start:new Date(year,3,1),  end:new Date(year,5,30)  },
    { q:3, label:'Q3', months:'Jul – Sep', start:new Date(year,6,1),  end:new Date(year,8,30)  },
    { q:4, label:'Q4', months:'Oct – Dec', start:new Date(year,9,1),  end:new Date(year,11,31) },
  ];

  // Current quarter first, then future quarters, then past
  const sorted = [
    quarters.find(q=>q.q===currentQ),
    ...quarters.filter(q=>q.q>currentQ),
    ...quarters.filter(q=>q.q<currentQ),
  ];

  function projectsInQuarter(q) {
    return store.projects.filter(p => {
      const d = p.endDate ? new Date(p.endDate+'T12:00:00') : (p.startDate ? new Date(p.startDate+'T12:00:00') : null);
      return d && d >= q.start && d <= q.end;
    });
  }

  // Year totals across ALL projects
  const allRev   = store.projects.reduce((s,p)=>s+(getBudgetTotals(p).forecast*1.2),0);
  const allMark  = store.projects.reduce((s,p)=>s+(getBudgetTotals(p).forecast*0.2),0);
  const allCosts = store.projects.reduce((s,p)=>s+getBudgetTotals(p).actuals,0);
  const allProfit= allRev - allCosts;

  function renderQ(q) {
    const isCurrent = q.q === currentQ;
    const projects  = projectsInQuarter(q);
    const qRev      = projects.reduce((s,p)=>s+(getBudgetTotals(p).forecast*1.2),0);
    const qMark     = projects.reduce((s,p)=>s+(getBudgetTotals(p).forecast*0.2),0);
    const qCosts    = projects.reduce((s,p)=>s+getBudgetTotals(p).actuals,0);
    const qProfit   = qRev - qCosts;
    const pct       = qRev>0 ? Math.min(100,Math.round(qCosts/qRev*100)) : 0;

    return `
      <div style="background:var(--surface);border:${isCurrent?'2px solid var(--accent)':'1.5px solid var(--border)'};border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;${isCurrent?'box-shadow:0 4px 20px rgba(240,192,64,0.1)':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${projects.length?'16px':'0'}">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="font-size:17px;font-weight:800;color:var(--navy)">${q.label} ${year}</div>
            ${isCurrent?`<span style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--accent);color:var(--navy);padding:2px 8px;border-radius:20px">Current</span>`:''}
          </div>
          <div style="font-size:12px;color:var(--muted)">${q.months}</div>
        </div>

        ${projects.length===0
          ? `<div style="padding:14px 0 2px;color:var(--muted);font-size:13px">No projects this quarter.</div>`
          : `
            <div style="margin-bottom:16px">
              ${projects.map(p=>`
                <div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 0.1s" onclick="navigate('project-detail',${p.id})" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">
                  <div style="width:9px;height:9px;border-radius:50%;background:${p.color||'var(--blue)'};flex-shrink:0"></div>
                  <div style="flex:1;font-weight:600;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
                  <div style="font-size:12px;color:var(--muted);flex-shrink:0">${p.type}</div>
                  <span class="status-badge badge-${p.status}" style="flex-shrink:0">${p.status}</span>
                  <div style="font-size:13px;font-weight:700;text-align:right;min-width:90px;flex-shrink:0">$${Math.round(getBudgetTotals(p).forecast*1.2).toLocaleString()}</div>
                </div>`).join('')}
            </div>

            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:${qRev>0?'12px':'0'}">
              <div style="background:var(--bg);border-radius:8px;padding:12px 14px">
                <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px">Revenue</div>
                <div style="font-size:17px;font-weight:800;color:var(--navy)">$${Math.round(qRev).toLocaleString()}</div>
              </div>
              <div style="background:var(--bg);border-radius:8px;padding:12px 14px">
                <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px">Markup (20%)</div>
                <div style="font-size:17px;font-weight:800;color:var(--green)">$${Math.round(qMark).toLocaleString()}</div>
              </div>
              <div style="background:var(--bg);border-radius:8px;padding:12px 14px">
                <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px">Costs</div>
                <div style="font-size:17px;font-weight:800;color:${qCosts>qRev?'var(--red)':'var(--text)'}">$${qCosts.toLocaleString()}</div>
              </div>
              <div style="background:var(--bg);border-radius:8px;padding:12px 14px">
                <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px">Profit</div>
                <div style="font-size:17px;font-weight:800;color:${qProfit>=0?'var(--green)':'var(--red)'}">${qProfit<0?'-':''}$${Math.abs(Math.round(qProfit)).toLocaleString()}</div>
              </div>
            </div>

            ${qRev>0?`
              <div>
                <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px">
                  <span>Costs vs Revenue</span><span style="font-weight:700">${pct}%</span>
                </div>
                <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                  <div style="height:100%;width:${pct}%;background:${pct>90?'var(--red)':pct>65?'var(--orange)':'var(--green)'};border-radius:3px;transition:width 0.4s"></div>
                </div>
              </div>`:''}`}
      </div>`;
  }

  // Projects with no date — show at bottom
  const undated = store.projects.filter(p=>!p.startDate&&!p.endDate);

  return `
    <div class="topbar">
      <div><div class="page-title">Snapshot</div><div class="page-sub">${year} — Company Overview</div></div>
    </div>
    <div class="content">

      <!-- Year at a glance -->
      <div style="background:var(--navy);border-radius:var(--radius);padding:22px 24px;margin-bottom:22px">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.35);margin-bottom:16px;font-weight:700">${year} at a glance · All projects</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
          <div>
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.4);font-weight:700;margin-bottom:5px">Revenue</div>
            <div style="font-size:24px;font-weight:800;color:#fff">$${Math.round(allRev/1000)}k</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px">incl. 20% markup</div>
          </div>
          <div>
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.4);font-weight:700;margin-bottom:5px">Markup</div>
            <div style="font-size:24px;font-weight:800;color:var(--accent)">$${Math.round(allMark/1000)}k</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px">agency fee (20%)</div>
          </div>
          <div>
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.4);font-weight:700;margin-bottom:5px">Costs</div>
            <div style="font-size:24px;font-weight:800;color:#fff">$${Math.round(allCosts/1000)}k</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px">logged expenses</div>
          </div>
          <div>
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.4);font-weight:700;margin-bottom:5px">Net Profit</div>
            <div style="font-size:24px;font-weight:800;color:${allProfit>=0?'var(--green-light)':'var(--red-light)'}">$${Math.round(Math.abs(allProfit)/1000)}k</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px">${allProfit>=0?'on track':'over budget'}</div>
          </div>
        </div>
      </div>

      <!-- Quarters -->
      ${sorted.map(q=>renderQ(q)).join('')}

      <!-- Undated projects -->
      ${undated.length>0?`
        <div style="background:var(--surface);border:1.5px dashed var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px">
          <div style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px">No dates set</div>
          ${undated.map(p=>`
            <div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="navigate('project-detail',${p.id})">
              <div style="width:9px;height:9px;border-radius:50%;background:${p.color||'var(--blue)'};flex-shrink:0"></div>
              <div style="flex:1;font-weight:600;font-size:13px">${p.name}</div>
              <span class="status-badge badge-${p.status}">${p.status}</span>
              <div style="font-size:12px;color:var(--muted)">Add dates to include in quarters</div>
            </div>`).join('')}
        </div>`:''}

    </div>`;
}

function signoffProgress(p) {
  if(!p.signoff) return 0;
  return SIGNOFF_STEPS.filter(s=>p.signoff[s.id]?.completed).length;
}

function getBudgetTotals(p) {
  if (!p.budgetLines) p.budgetLines = BUDGET_CATS.map((cat,i)=>({id:i+1,category:cat,forecast:0,actuals:0}));
  const rawForecast = p.budgetLines.reduce((s,l)=>s+(l.forecast||0),0);
  const forecast = rawForecast > 0 ? rawForecast : (p.budgetTarget || 0);
  const invoiceActuals = (p.invoices||[]).filter(i=>i.status==='paid').reduce((s,i)=>s+(i.amount||0),0);
  const teamActuals = store.team.reduce((s,m)=>s+(m.payments||[]).filter(pay=>pay.status==='paid'&&pay.projectId===p.id).reduce((a,pay)=>a+(pay.amount||0),0),0);
  const actuals = invoiceActuals + teamActuals;
  return { forecast, actuals, rawForecast };
}

function getProjectHealth(p) {
  if(p.status==='completed'||p.status==='pitched') return null;
  const today=new Date();today.setHours(0,0,0,0);
  let score=0;
  const {forecast,actuals}=getBudgetTotals(p);
  const budgetPct=forecast>0?actuals/forecast:0;
  if(budgetPct>=1) score=Math.max(score,2);
  else if(budgetPct>=0.85) score=Math.max(score,1);
  if(p.endDate&&p.status==='active'){
    const end=new Date(p.endDate+'T12:00:00');
    const daysLeft=Math.ceil((end-today)/86400000);
    if(daysLeft<0) score=Math.max(score,2);
    else if(daysLeft<=7) score=Math.max(score,2);
    else if(daysLeft<=14) score=Math.max(score,1);
  }
  if(p.status==='active'){
    const soPct=signoffProgress(p)/SIGNOFF_STEPS.length;
    if(soPct<0.3&&budgetPct>0.5) score=Math.max(score,1);
  }
  return [{color:'#16A34A',label:'On track'},{color:'#D97706',label:'Needs attention'},{color:'#DC2626',label:'At risk'}][score];
}

function renderProjectCard(p) {
  const {forecast,actuals}=getBudgetTotals(p);

function renderSignoffTab(p) {
  if(!p.signoff) p.signoff=emptySignoff();
  const completed=SIGNOFF_STEPS.filter(s=>p.signoff[s.id]?.completed).length;
  const total=SIGNOFF_STEPS.length;
  const pct=Math.round(completed/total*100);
  const nextStep=SIGNOFF_STEPS.find(s=>!p.signoff[s.id]?.completed);
  const allDone=completed===total;
  return `
    <div class="signoff-header">
      <div class="signoff-progress-label">
        <div class="signoff-progress-text">${allDone?'✓ All stages complete':completed+' of '+total+' stages complete'}</div>
        <div class="signoff-progress-pct">${pct}%</div>
      </div>
      <div class="signoff-bar"><div class="signoff-bar-fill" style="width:${pct}%"></div></div>
      ${!allDone&&nextStep?`<div class="signoff-current">Next up: <strong>${nextStep.label}</strong></div>`:''}
    </div>
    <div class="signoff-list">
      ${SIGNOFF_STEPS.map((step,i)=>{
        const data=p.signoff[step.id]||{};
        const isDone=data.completed;
        const isNext=!isDone&&SIGNOFF_STEPS.slice(0,i).every(s=>p.signoff[s.id]?.completed);
        const stateClass=isDone?'completed':isNext?'current':'future';
        const iconClass=isDone?'done':isNext?'next':'pending';
        const iconChar=isDone?'✓':(i+1);
        return `
          <div class="signoff-step ${stateClass}">
            <div class="signoff-icon ${iconClass}">${iconChar}</div>
            <div class="signoff-step-info">
              <div class="signoff-step-label">${step.label}</div>
              ${isDone?`<div class="signoff-step-meta"><strong>${data.completedBy}</strong> · ${formatDate(data.completedAt)}</div>`:''}
              ${isNext?`<div class="signoff-step-meta">Ready to sign off</div>`:''}
            </div>
            <div class="signoff-actions">
              ${isDone?`<button class="btn btn-ghost btn-sm" onclick="undoSignoff('${step.id}')">Undo</button>`:''}
              ${isNext?`<button class="btn btn-green btn-sm" onclick="openSignoffModal('${step.id}')">Sign Off</button>`:''}
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

function openSignoffModal(stepId) {
  const step=SIGNOFF_STEPS.find(s=>s.id===stepId);

function confirmSignoff(stepId) {

function undoSignoff(stepId) {

function prefillKeyContact(val) {
  if (!val) return;
  const [type, id] = val.split(':');
  const numId = parseInt(id);
  let record;
  if (type === 'team') record = store.team.find(m=>m.id===numId);
  else record = store.contacts.find(c=>c.id===numId);
  if (!record) return;
  document.getElementById('kc-name').value = record.name || '';
  document.getElementById('kc-phone').value = record.phone || '';
  document.getElementById('kc-email').value = record.email || '';
  if (!document.getElementById('kc-role').value) {
    document.getElementById('kc-role').value = record.role || '';
  }
}
function addKeyContact() {
  const role = document.getElementById('kc-role').value.trim();
  const name = document.getElementById('kc-name').value.trim();
  if (!role || !name) { toast('Role and name required'); return; }
  const p = currentProject;
  if (!p.production.keyContacts) p.production.keyContacts = [];
  p.production.keyContacts.push({
    id: store.nextId.keyContacts++,
    productionRole: role,
    name,
    phone: document.getElementById('kc-phone').value,
    email: document.getElementById('kc-email').value,
  });
  closeModal(); save(); toast('Contact added'); render();
}
function removeKeyContact(id) {
  const p = currentProject;
  p.production.keyContacts = p.production.keyContacts.filter(kc=>kc.id!==id);
  save(); toast('Removed'); render();
}

const BUDGET_CATS = ['Fabrication','Furniture & Décor','AV + Content Tech','Team','Uniforms & Materials','Print Collateral','Production Misc.','Other'];
function ensureBudgetLines(p) {
  if (!p.budgetLines) {
    p.budgetLines = BUDGET_CATS.map((cat,i)=>({id:i+1,category:cat,forecast:0,actuals:0}));
  }
}
function renderBudgetTab(p) {
  ensureBudgetLines(p);
  const paidByCat={};
  (p.invoices||[]).filter(i=>i.status==='paid').forEach(i=>{paidByCat[i.category]=(paidByCat[i.category]||0)+(i.amount||0);});
  store.team.forEach(m=>(m.payments||[]).filter(pay=>pay.status==='paid'&&pay.projectId===p.id).forEach(pay=>{paidByCat['Team']=(paidByCat['Team']||0)+(pay.amount||0);}));
  const fTotal=p.budgetLines.reduce((s,l)=>s+(l.forecast||0),0);
  const aTotal=Object.values(paidByCat).reduce((s,v)=>s+v,0);
  const remaining=fTotal-aTotal, over=aTotal>fTotal;
  const pct=fTotal>0?Math.round(aTotal/fTotal*100):0;
  const target=p.budgetTarget||0;
  const unallocated=target-fTotal, envelopeOver=target>0&&fTotal>target;

  const tableRows=p.budgetLines.map((line,idx)=>{
    const lineActuals=paidByCat[line.category]||0;
    const variance=(line.forecast||0)-lineActuals, varOver=variance<0;

      <td style="font-weight:600">${line.category}</td>

        </div>
        <div>
          <div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:3px">Actuals</div>

        </div>

          <div style="font-size:15px;font-weight:800;color:${varOver?'var(--red)':variance===0?'var(--muted)':'var(--green)'}">${varOver?'−':''}$${Math.abs(variance).toLocaleString()}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  return `
    ${target>0?`<div style="background:var(--accent-light);border:1.5px solid var(--accent);border-radius:12px;padding:14px 20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px">

      <div style="text-align:right"><div style="font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:var(--muted);margin-bottom:3px">Remaining</div><div style="font-size:20px;font-weight:800;color:${envelopeOver?'var(--red)':unallocated===0?'var(--muted)':'var(--green)'}">${envelopeOver?'−':''}$${Math.abs(unallocated).toLocaleString()}</div></div>

            <td style="text-align:right;font-weight:800;color:var(--navy);padding-top:12px">$${fTotal.toLocaleString()}</td>
            <td style="text-align:right;font-weight:800;color:var(--muted);padding-top:12px">$${aTotal.toLocaleString()}</td>

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function renderCalendar() {
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthNamesShort=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayInitials=['M','T','W','T','F','S','S'];

  // ── Mobile: week strip + agenda ──────────────────────────────────────────
  const todayMob=new Date(); todayMob.setHours(0,0,0,0);
  const dowMob=(todayMob.getDay()+6)%7;
  const weekMon=new Date(todayMob); weekMon.setDate(todayMob.getDate()-dowMob+calMobileWeekOffset*7);
  const weekDays=Array.from({length:7},(_,i)=>{const d=new Date(weekMon);d.setDate(weekMon.getDate()+i);return d;});
  const weekSun=weekDays[6];

  const weekStripHtml=weekDays.map((d,i)=>{
    const isToday=d.toDateString()===todayMob.toDateString();
    const dots=store.projects.filter(p=>{
      if(!p.startDate||!p.endDate)return false;
      const s=new Date(p.startDate+'T00:00:00'),e=new Date(p.endDate+'T23:59:59');
      return d>=s&&d<=e;
    }).slice(0,3).map(p=>`<span class="cal-wd-dot" style="background:${p.color||'#2563EB'}"></span>`).join('');
    return`<div class="cal-wd${isToday?' today':''}">
      <div class="cal-wd-name">${dayInitials[i]}</div>
      <div class="cal-wd-num">${d.getDate()}</div>
      <div class="cal-wd-dots">${dots}</div>
    </div>`;
  }).join('');

  const weekLabel=weekMon.getMonth()===weekSun.getMonth()
    ?`${monthNamesShort[weekMon.getMonth()]} ${weekMon.getFullYear()}`
    :`${monthNamesShort[weekMon.getMonth()]} – ${monthNamesShort[weekSun.getMonth()]} ${weekSun.getFullYear()}`;

  const weekProjects=store.projects.filter(p=>{
    if(!p.startDate&&!p.endDate)return false;
    const s=p.startDate?new Date(p.startDate+'T00:00:00'):null;
    const e=p.endDate?new Date(p.endDate+'T23:59:59'):null;
    return(!s||s<=weekSun)&&(!e||e>=weekMon);
  }).sort((a,b)=>new Date(a.startDate||'9999')-new Date(b.startDate||'9999'));

  const agendaHtml=weekProjects.length===0
    ?`<div class="empty-state" style="padding:16px 0"><p>No projects scheduled this week.</p></div>`
    :weekProjects.map(p=>{
      const health=getProjectHealth(p);
      return`<div class="cal-agenda-item" onclick="navigate('project-detail',${p.id})">
        <div class="cal-agenda-accent" style="background:${p.color||'#2563EB'}"></div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
            ${health?`<div style="width:7px;height:7px;border-radius:50%;background:${health.color};flex-shrink:0"></div>`:''}
            <div class="cal-agenda-name">${p.name}</div>
          </div>
          ${p.client?`<div class="cal-agenda-meta">${p.client}</div>`:''}
          <div class="cal-agenda-meta">${formatDate(p.startDate)} → ${formatDate(p.endDate)}</div>
        </div>
        <div class="status-badge badge-${p.status}" style="align-self:flex-start;margin-top:2px">${p.status}</div>
      </div>`;
    }).join('');

  const mobileView=`
    <div class="cal-mobile-view">
      <div class="section-header" style="margin-bottom:8px"><div class="section-title">On the docket</div><div style="font-size:12px;color:var(--muted)">Next 5 days</div></div>
      <div class="cal-list" style="margin-bottom:24px">DOCKET_PLACEHOLDER</div>
      <div class="cal-week-nav">
        <button class="btn btn-ghost btn-sm" onclick="calMobileWeekOffset--;render()">← Prev</button>
        <div class="cal-week-label">${weekLabel}</div>
        <button class="btn btn-ghost btn-sm" onclick="calMobileWeekOffset++;render()">Next →</button>
      </div>
      <div class="cal-week-strip">${weekStripHtml}</div>
      <div class="section-header" style="margin-bottom:8px"><div class="section-title">This week</div></div>
      ${agendaHtml}
      <div class="section-header" style="margin-top:24px;margin-bottom:8px"><div class="section-title">All Projects</div></div>
      <div class="cal-list">ALL_PROJECTS_PLACEHOLDER</div>
    </div>`;

  const firstDay=new Date(calYear,calMonth,1),lastDay=new Date(calYear,calMonth+1,0);
  const startDow=(firstDay.getDay()+6)%7,totalDays=lastDay.getDate();
  const today=new Date();
  let cells=[];
  for(let i=0;i<startDow;i++) cells.push({date:new Date(calYear,calMonth,-startDow+i+1),thisMonth:false});
  for(let d=1;d<=totalDays;d++) cells.push({date:new Date(calYear,calMonth,d),thisMonth:true});
  while(cells.length%7!==0){const last=cells[cells.length-1].date;cells.push({date:new Date(last.getFullYear(),last.getMonth(),last.getDate()+1),thisMonth:false});}
  function renderCell(cell) {
    const isToday=cell.thisMonth&&cell.date.getDate()===today.getDate()&&cell.date.getMonth()===today.getMonth()&&cell.date.getFullYear()===today.getFullYear();
    const colIdx=(cell.date.getDay()+6)%7;
    const isWeekStart=colIdx===0,isWeekEnd=colIdx===6;
    const events=store.projects.filter(p=>{
      if(!p.startDate||!p.endDate)return false;
      const s=new Date(p.startDate+'T00:00:00'),e=new Date(p.endDate+'T23:59:59');
      return cell.date>=s&&cell.date<=e;
    });
    const evHtml=events.slice(0,3).map(p=>{
      const clr=p.color||'#2563EB';
      const isStart=cell.date.toDateString()===new Date(p.startDate+'T12:00:00').toDateString();
      const isEnd=cell.date.toDateString()===new Date(p.endDate+'T12:00:00').toDateString();
      const leftEdge=isStart||isWeekStart,rightEdge=isEnd||isWeekEnd;
      let margin,radius;
      if(leftEdge&&rightEdge){margin='1px 0';radius='3px';}
      else if(leftEdge){margin='1px -6px 1px 0';radius='3px 0 0 3px';}
      else if(rightEdge){margin='1px 0 1px -6px';radius='0 3px 3px 0';}
      else{margin='1px -6px';radius='0';}
      return`<div class="cal-event" style="background:${clr}CC;color:#fff;margin:${margin};border-radius:${radius};padding:2px ${leftEdge?'5px':'1px'}" onclick="event.stopPropagation();navigate('project-detail',${p.id})">${leftEdge?p.name.split('—')[0].trim():''}</div>`;
    }).join('');
    return`<div class="cal-day ${!cell.thisMonth?'other-month':''} ${isToday?'today':''}"><div class="cal-day-num">${cell.date.getDate()}</div>${evHtml}</div>`;
  }
  const sorted=[...store.projects].filter(p=>p.startDate||p.endDate).sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));

  // On the docket — next 5 days
  const todayD=new Date(); todayD.setHours(0,0,0,0);
  const in5=new Date(todayD); in5.setDate(in5.getDate()+5);
  const docket=[];
  store.projects.forEach(p=>{
    if(p.startDate){const d=new Date(p.startDate+'T12:00:00');if(d>=todayD&&d<=in5)docket.push({date:d,label:p.name,sublabel:'Project kicks off',icon:'▦',color:p.color||'var(--blue)',projectId:p.id});}
    if(p.endDate){const d=new Date(p.endDate+'T12:00:00');if(d>=todayD&&d<=in5)docket.push({date:d,label:p.name,sublabel:'Deadline',icon:'⚑',color:'var(--red)',projectId:p.id});}
    if(p.production&&p.production.shootDays){p.production.shootDays.forEach(sd=>{const d=new Date(sd.date+'T12:00:00');if(d>=todayD&&d<=in5)docket.push({date:d,label:sd.location||p.name,sublabel:p.name+(sd.callTime?' · Call '+sd.callTime:''),icon:'◉',color:'var(--orange)',projectId:p.id});});}
    if(p.tasks){p.tasks.forEach(t=>{if(!t.dueDate||t.status==='done')return;const d=new Date(t.dueDate+'T12:00:00');if(d>=todayD&&d<=in5)docket.push({date:d,label:t.name,sublabel:p.name+' · '+t.category+(t.assignedTo?' · '+t.assignedTo:''),icon:'◆',color:t.status==='in-progress'?'var(--blue)':t.status==='blocked'?'var(--red)':'var(--muted)',projectId:p.id});});}
  });
  docket.sort((a,b)=>a.date-b.date);
  const docketHtml = docket.length===0
    ? `<div class="empty-state" style="padding:20px"><p>Nothing scheduled in the next 5 days.</p></div>`
    : docket.map(item=>`<div class="cal-list-item" onclick="navigate('project-detail',${item.projectId})">
        <div style="background:${item.color};color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0">${item.icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${item.label}</div>
          <div style="font-size:12px;color:var(--muted)">${item.sublabel}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:12px;font-weight:700;color:var(--navy)">${item.date.toLocaleDateString('en-CA',{weekday:'short',day:'numeric',month:'short'})}</div>
          <div style="font-size:11px;color:var(--muted)">${item.date.toDateString()===todayD.toDateString()?'Today':Math.ceil((item.date-todayD)/86400000)+' days away'}</div>
        </div>
      </div>`).join('');

  const allProjectsHtml=sorted.map(p=>`<div class="cal-list-item" onclick="navigate('project-detail',${p.id})"><div class="cal-dot" style="background:${p.color||'var(--blue)'}"></div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${p.name}</div><div style="font-size:12px;color:var(--muted)">${p.client}</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:12px;font-weight:600">${formatDate(p.startDate)}</div><div style="font-size:11px;color:var(--muted)">→ ${formatDate(p.endDate)}</div></div><div class="status-badge badge-${p.status}">${p.status}</div></div>`).join('');

  const finalMobileView=mobileView.replace('DOCKET_PLACEHOLDER',docketHtml).replace('ALL_PROJECTS_PLACEHOLDER',allProjectsHtml);

  return `
    <div class="topbar"><div><div class="page-title">Calendar</div><div class="page-sub">Project timeline overview</div></div></div>
    <div class="content">
      ${finalMobileView}
      <div class="cal-desktop-view">
        <div class="section-header"><div class="section-title">On the docket</div><div style="font-size:12px;color:var(--muted)">Next 5 days</div></div>
        <div class="cal-list" style="margin-bottom:24px">${docketHtml}</div>
        <div class="cal-nav"><button class="btn btn-ghost btn-sm" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}render()">← Prev</button><div class="cal-month">${monthNames[calMonth]} ${calYear}</div><button class="btn btn-ghost btn-sm" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}render()">Next →</button></div>
        <div class="cal-grid"><div class="cal-header">${days.map(d=>`<div class="cal-header-cell">${d}</div>`).join('')}</div><div class="cal-body">${cells.map(c=>renderCell(c)).join('')}</div></div>
        <div class="section-header"><div class="section-title">All Projects</div></div>
        <div class="cal-list">${allProjectsHtml}</div>
      </div>
    </div>`;
}

const LEAD_STATUSES=[{key:'not-contacted',label:'Not Contacted'},{key:'reached-out',label:'Reached Out'},{key:'in-conversation',label:'In Conversation'},{key:'proposal-sent',label:'Proposal Sent'},{key:'won',label:'Won'},{key:'lost',label:'Lost'}];
function renderLeads() {
  const ap=LEAD_STATUSES.filter(s=>!['won','lost'].includes(s.key)).map(s=>({...s,leads:store.leads.filter(l=>l.status===s.key),value:store.leads.filter(l=>l.status===s.key).reduce((sum,l)=>sum+(l.estimatedValue||0),0)}));
  const tv=store.leads.filter(l=>!['won','lost'].includes(l.status)).reduce((s,l)=>s+(l.estimatedValue||0),0);
  return `
    <div class="topbar"><div><div class="page-title">Leads</div><div class="page-sub">${store.leads.length} leads · $${tv.toLocaleString()} pipeline</div></div><button class="btn btn-primary" onclick="openNewLeadModal()">+ Add</button></div>
    <div class="content">
      <div class="pipeline">${ap.map(s=>`<div class="pipeline-col"><div class="pipeline-col-label">${s.label}</div><div class="pipeline-col-count">${s.leads.length}</div>${s.value>0?`<div class="pipeline-col-value">$${s.value.toLocaleString()}</div>`:''}</div>`).join('')}</div>
      <div class="section-header"><div class="section-title">All Leads</div></div>
      <div class="card">
        ${store.leads.length===0?`<div class="empty-state"><div class="empty-icon">◉</div><p>No leads yet.</p></div>`:''}
        ${store.leads.map(l=>{const converted=l.convertedProjectId?store.projects.find(p=>p.id===l.convertedProjectId):null;return`<div class="lead-row"><div class="lead-avatar">${initials(l.company)}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="lead-name">${l.company}</div><div class="status-badge badge-${converted?'converted':l.status}">${converted?'Converted':LEAD_STATUSES.find(s=>s.key===l.status)?.label||l.status}</div></div><div class="lead-detail">${l.contactName}${l.contactRole?' · '+l.contactRole:''}${l.contactEmail?' · '+l.contactEmail:''}${l.contactPhone?' · '+l.contactPhone:''} · ${l.projectType}</div>${l.estimatedValue?`<div class="lead-detail" style="color:var(--blue);font-weight:700">Est. $${l.estimatedValue.toLocaleString()}</div>`:''}${converted?`<div class="lead-detail" style="color:var(--green);font-weight:600;cursor:pointer" onclick="navigate('project-detail',${converted.id})">→ ${converted.name}</div>`:''}${l.notes?`<div class="lead-notes">${l.notes}</div>`:''}</div><div class="lead-actions">${!converted&&l.status==='won'?`<button class="btn btn-primary btn-sm" onclick="openConvertLeadModal(${l.id})">Convert →</button>`:''}${!converted?`<button class="btn btn-ghost btn-sm" onclick="openEditLeadModal(${l.id})">Edit</button>`:''}<button class="btn btn-ghost btn-sm" onclick="deleteLead(${l.id})">✕</button></div></div>`}).join('')}
      </div>
    </div>`;
}

const AVAIL_LABEL = {available:'Available',busy:'Busy',away:'Away'};
const CONTRACT_LABEL = {'not-sent':'No Contract','sent':'Contract Sent','signed':'Signed','expired':'Expired'};
const IR35_LABEL = {'outside':'Self-Employed','inside':'T4 Employee','not-assessed':'Status TBC'};

function renderTeam() {

  const pendingTotal = store.team.reduce((s,m)=>s+m.payments.filter(p=>p.status==='pending').reduce((a,p)=>a+p.amount,0),0);
  const overdueTotal = store.team.reduce((s,m)=>s+m.payments.filter(p=>p.status==='overdue').reduce((a,p)=>a+p.amount,0),0);
  return `
    <div class="topbar"><div><div class="page-title">Team</div><div class="page-sub">${store.team.length} freelancers · ${avail.available} available</div></div><button class="btn btn-primary" onclick="openNewMemberModal()">+ Add</button></div>
    <div class="content">
      <div class="stats-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
        <div class="stat-card"><div class="stat-label">Available</div><div class="stat-value" style="color:var(--green)">${avail.available}</div></div>
        <div class="stat-card"><div class="stat-label">Busy</div><div class="stat-value" style="color:var(--accent-dark)">${avail.busy}</div></div>
        <div class="stat-card"><div class="stat-label">Pending Pay</div><div class="stat-value" style="color:var(--orange)">$${pendingTotal.toLocaleString()}</div></div>
        <div class="stat-card"><div class="stat-label">Overdue</div><div class="stat-value" style="color:var(--red)">$${overdueTotal.toLocaleString()}</div></div>
      </div>
      <div class="team-grid">${store.team.map(m=>{
        const pending=m.payments.filter(p=>p.status==='pending').reduce((s,p)=>s+p.amount,0);
        const overdue=m.payments.filter(p=>p.status==='overdue').reduce((s,p)=>s+p.amount,0);
        return `<div class="team-card" style="cursor:pointer;align-items:flex-start;text-align:left" onclick="navigate('team-profile',undefined,${m.id})">
          <div style="display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px">
            <div class="team-avatar-lg" style="margin-bottom:0;flex-shrink:0">${initials(m.name)}</div>
            <div style="min-width:0">
              <div class="team-name">${m.name}</div>
              <div class="team-role">${m.role}</div>
              <div class="team-rate" style="margin-top:2px">$${m.rate}/day</div>
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">
            <span class="status-badge badge-${m.availability}">${AVAIL_LABEL[m.availability]||m.availability}</span>
            <span class="status-badge badge-${m.contractStatus}">${CONTRACT_LABEL[m.contractStatus]||m.contractStatus}</span>
            <span class="status-badge badge-${m.ir35}">${IR35_LABEL[m.ir35]||m.ir35}</span>
          </div>
          ${m.availableFrom&&m.availability!=='available'?`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Available from ${formatDate(m.availableFrom)}</div>`:''}
          <div class="skill-tags" style="justify-content:flex-start">${m.skills.map(s=>`<span class="skill-tag">${s}</span>`).join('')}</div>
          ${overdue>0?`<div style="margin-top:10px;font-size:12px;font-weight:700;color:var(--red)">⚠ $${overdue.toLocaleString()} overdue</div>`:''}
          ${pending>0&&overdue===0?`<div style="margin-top:10px;font-size:12px;color:var(--muted)">$${pending.toLocaleString()} pending</div>`:''}
        </div>`;
      }).join('')}</div>
    </div>`;
}
