<!-- LOGIN SCREEN -->
<div id="login-screen" style="display:flex;position:fixed;inset:0;background:var(--bg);z-index:9999;align-items:center;justify-content:center">
  <div style="width:100%;max-width:360px;padding:24px">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:32px;font-weight:700;color:var(--text);letter-spacing:-0.5px">FELT</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:0.08em;text-transform:uppercase">Studio</div>
    </div>
    <div style="background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:24px">
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Email</label>
        <input id="login-email" type="email" placeholder="you@feltcreative.ca" onkeydown="if(event.key==='Enter')document.getElementById('login-password').focus()" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none">
      </div>
      <div style="margin-bottom:6px">
        <label style="display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px">Password</label>
        <input id="login-password" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none">
      </div>
      <div id="login-error" style="color:var(--red);font-size:12px;min-height:18px;margin-bottom:12px;padding-top:6px"></div>
      <button id="login-btn" onclick="login()" style="width:100%;padding:11px;background:var(--text);color:var(--bg);border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity 0.15s">Sign in</button>
    </div>
  </div>
</div>

<!-- Future Feels overlay -->

    </div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button id="ff-back" onclick="goBackFutureFeels()" style="display:none;background:transparent;border:1.5px solid var(--border);color:var(--muted);padding:9px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all 0.15s" onmouseover="this.style.background='var(--bg)';this.style.color='var(--text)'" onmouseout="this.style.background='transparent';this.style.color='var(--muted)'">← Back</button>
      <button onclick="openFutureFeels()" style="flex:1;background:transparent;border:1.5px solid var(--border);color:var(--muted);padding:9px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all 0.15s" onmouseover="this.style.background='var(--bg)';this.style.color='var(--text)'" onmouseout="this.style.background='transparent';this.style.color='var(--muted)'">Another</button>
      <button onclick="closeFutureFeels()" style="flex:1;background:var(--accent);border:none;color:var(--navy);padding:9px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700">Done</button>
    </div>
  </div>
</div>

</body>
</html>
