<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FELT — Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #F4F1EC;
    --surface: #FFFFFF;
    --border: #E2DDD6;
    --text: #1C1C1A;
    --muted: #8A857D;
    --accent: #C4714A;
    --accent-light: #F5E8E1;
    --green: #4A7C59;
    --green-light: #E3EDE7;
    --blue: #3A5F8A;
    --blue-light: #E1EAF5;
    --yellow: #C4A44A;
    --yellow-light: #F5F0E1;
    --purple: #7A5F8A;
    --purple-light: #EDE1F5;
    --sidebar-w: 220px;
    --radius: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
  }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--text);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    padding: 0 0 24px;
  }

  .sidebar-logo {
    padding: 28px 24px 24px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 12px;
  }

  .sidebar-logo span { color: var(--accent); }

  .nav-section { padding: 0 12px; margin-bottom: 4px; }

  .nav-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    padding: 10px 12px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 7px;
    cursor: pointer;
    color: rgba(255,255,255,0.6);
    font-size: 13.5px;
    transition: all 0.15s;
    user-select: none;
  }

  .nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .nav-item.active { background: var(--accent); color: #fff; }
  .nav-item .icon { width: 16px; text-align: center; font-size: 15px; }

  .sidebar-footer { margin-top: auto; padding: 0 12px; }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 7px;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
  }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* MAIN */
  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

  .topbar {
    background: var(--bg);
    padding: 24px 32px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .page-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .btn {
    padding: 8px 16px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s;
  }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #b5623d; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface); color: var(--text); }
  .btn-sm { padding: 5px 11px; font-size: 12px; }

  .content { padding: 24px 32px 40px; }

  /* CARDS */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px;
  }

  /* STATS ROW */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }

  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* PROJECTS GRID */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .project-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-1px); }

  .project-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }

  .project-card.status-active::before { background: var(--green); }
  .project-card.status-planning::before { background: var(--yellow); }
  .project-card.status-completed::before { background: var(--muted); }

  .project-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .project-name { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
  .project-client { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .status-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .badge-active { background: var(--green-light); color: var(--green); }
  .badge-planning { background: var(--yellow-light); color: var(--yellow); }
  .badge-completed { background: #f0f0f0; color: var(--muted); }
  .badge-pitched { background: var(--blue-light); color: var(--blue); }
  .badge-not-contacted { background: #f0f0f0; color: var(--muted); }
  .badge-reached-out { background: var(--yellow-light); color: var(--yellow); }
  .badge-in-conversation { background: var(--blue-light); color: var(--blue); }
  .badge-proposal-sent { background: var(--purple-light); color: var(--purple); }
  .badge-won { background: var(--green-light); color: var(--green); }
  .badge-lost { background: #fdecea; color: #c0392b; }

  .project-meta {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .meta-item { font-size: 12px; color: var(--muted); }
  .meta-item strong { color: var(--text); display: block; font-size: 13px; font-weight: 600; }

  .team-avatars { display: flex; }
  .team-avatar-sm {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--surface);
    margin-right: -6px;
  }

  /* PROJECT DETAIL */
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 13px; cursor: pointer;
    margin-bottom: 16px;
    width: fit-content;
  }
  .back-btn:hover { color: var(--text); }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    width: fit-content;
  }

  .tab {
    padding: 7px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    transition: all 0.15s;
  }

  .tab:hover { color: var(--text); }
  .tab.active { background: var(--text); color: #fff; font-weight: 600; }

  /* FORMS */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  input, textarea, select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    transition: border 0.15s;
    outline: none;
  }

  input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: vertical; min-height: 100px; }

  /* BUDGET */
  .budget-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }

  .budget-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }

  .budget-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 6px; }
  .budget-value { font-size: 24px; font-weight: 800; }
  .budget-value.over { color: #c0392b; }
  .budget-value.under { color: var(--green); }

  .budget-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }

  .budget-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--green);
    transition: width 0.3s;
  }

  .budget-bar-fill.over { background: #c0392b; }

  /* TABLE */
  .table { width: 100%; border-collapse: collapse; }
  .table th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .table tr:last-child td { border-bottom: none; }
  .table tr:hover td { background: var(--bg); }

  /* TEAM */
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .team-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .team-avatar-lg {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 18px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }

  .team-name { font-size: 15px; font-weight: 700; }
  .team-role { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .team-rate { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 8px; }

  .skill-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 10px; }
  .skill-tag {
    font-size: 10px;
    padding: 3px 8px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 20px;
    font-weight: 600;
  }

  /* CONTACTS */
  .contact-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .contact-row:last-child { border-bottom: none; }

  .contact-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--blue-light);
    color: var(--blue);
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .contact-name { font-size: 14px; font-weight: 600; }
  .contact-detail { font-size: 12px; color: var(--muted); }
  .contact-actions { margin-left: auto; display: flex; gap: 8px; }

  /* LEADS PIPELINE */
  .pipeline {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .pipeline-col {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: center;
  }

  .pipeline-col-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 4px; }
  .pipeline-col-count { font-size: 26px; font-weight: 800; }
  .pipeline-col-value { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .lead-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .lead-row:last-child { border-bottom: none; }

  .lead-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--purple-light);
    color: var(--purple);
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .lead-name { font-size: 14px; font-weight: 700; }
  .lead-detail { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .lead-notes { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.4; }
  .lead-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: 14px;
    padding: 28px;
    width: 560px;
    max-width: 90vw;
    max-height: 85vh;
    overflow-y: auto;
    transform: translateY(10px);
    transition: transform 0.2s;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .section-title { font-size: 16px; font-weight: 700; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
  }
  .empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* BRIEF */
  .brief-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .brief-section { margin-bottom: 24px; }
  .brief-section:last-child { margin-bottom: 0; }
  .brief-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 8px; font-weight: 700; }
  .brief-section-content { font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }

  /* ALLOCATE */
  .allocate-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .allocate-row:last-child { border-bottom: none; }
  .allocate-info { display: flex; align-items: center; gap: 10px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--text);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    z-index: 200;
    transform: translateY(60px);
    opacity: 0;
    transition: all 0.3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

// ─── ROUTING ──────────────────────────────────────────────────────────────────
let currentView = 'dashboard';
let currentProject = null;
let currentTab = 'brief';

function navigate(view, projectId) {
  currentView = view;
  if (projectId !== undefined) {
    currentProject = store.projects.find(p => p.id === projectId);
    currentTab = 'brief';
  }
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navMap = { dashboard: 0, projects: 1, leads: 2, team: 3, contacts: 4 };
  const items = document.querySelectorAll('.nav-item');
  if (navMap[view] !== undefined) items[navMap[view]].classList.add('active');
  render();
}

function render() {
  const main = document.getElementById('main');
  if (currentView === 'dashboard') main.innerHTML = renderDashboard();
  else if (currentView === 'projects') main.innerHTML = renderProjects();
  else if (currentView === 'project-detail') main.innerHTML = renderProjectDetail();
  else if (currentView === 'leads') main.innerHTML = renderLeads();
  else if (currentView === 'team') main.innerHTML = renderTeam();
  else if (currentView === 'contacts') main.innerHTML = renderContacts();
}

// ─── LEADS ────────────────────────────────────────────────────────────────────
const LEAD_STATUSES = [

  { key: 'reached-out', label: 'Reached Out' },
  { key: 'in-conversation', label: 'In Conversation' },
  { key: 'proposal-sent', label: 'Proposal Sent' },
  { key: 'won', label: 'Won' },
  { key: 'lost', label: 'Lost' },
];

function renderLeads() {
  const pipeline = LEAD_STATUSES.map(s => ({
    ...s,
    leads: store.leads.filter(l => l.status === s.key),
    value: store.leads.filter(l => l.status === s.key).reduce((sum, l) => sum + (l.estimatedValue || 0), 0)

  const activePipeline = pipeline.filter(s => !['won','lost'].includes(s.key));
  const totalPipelineValue = store.leads
    .filter(l => !['won','lost'].includes(l.status))
    .reduce((s, l) => s + (l.estimatedValue || 0), 0);

  return `
    <div class="topbar">
      <div>
        <div class="page-title">Leads</div>
        <div class="page-sub">${store.leads.length} leads · £${totalPipelineValue.toLocaleString()} pipeline value</div>

    <div class="content">

        ${store.leads.length === 0 ? `<div class="empty-state"><div class="empty-icon">◉</div><p>No leads yet. Add your first one.</p></div>` : ''}
        ${store.leads.map(l => `
          <div class="lead-row">
            <div class="lead-avatar">${initials(l.company)}</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">

                <div class="status-badge badge-${l.status}">${LEAD_STATUSES.find(s=>s.key===l.status)?.label || l.status}</div>
              </div>
              <div class="lead-detail">${l.contactName}${l.contactEmail ? ' · ' + l.contactEmail : ''} · ${l.projectType}</div>
              ${l.estimatedValue ? `<div class="lead-detail" style="color:var(--accent);font-weight:600">Est. £${l.estimatedValue.toLocaleString()}</div>` : ''}

// ─── MODALS ───────────────────────────────────────────────────────────────────
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal')) closeModal(); }

function statusOptions(selected) {
  return LEAD_STATUSES.map(s => `<option value="${s.key}" ${selected===s.key?'selected':''}>${s.label}</option>`).join('');
}

function openNewLeadModal() {
  openModal(`
    <div class="modal-title">Add Lead</div>
    <div class="form-grid">
      <div class="form-group"><label>Company</label><input id="l-company" placeholder="Company name"></div>
      <div class="form-group"><label>Contact Name</label><input id="l-contact" placeholder="Full name"></div>
      <div class="form-group"><label>Contact Email</label><input id="l-email" type="email" placeholder="email@example.com"></div>
      <div class="form-group"><label>Project Type</label>
        <select id="l-type">
          <option>Brand Activation</option><option>Pop-Up</option><option>Branding</option>
          <option>Event</option><option>Creative Project</option><option>Other</option>
        </select>
      </div>
      <div class="form-group"><label>Estimated Value (£)</label><input id="l-value" type="number" placeholder="0"></div>
      <div class="form-group"><label>Status</label><select id="l-status">${statusOptions('not-contacted')}</select></div>
      <div class="form-group full"><label>Notes & Next Steps</label><textarea id="l-notes" placeholder="Context, how you met, what to do next..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createLead()">Add Lead</button>
    </div>
  `);
}

function createLead() {
  const company = document.getElementById('l-company').value.trim();
  if (!company) { toast('Company name required'); return; }
  store.leads.push({
    id: store.nextId.leads++,
    company,
    contactName: document.getElementById('l-contact').value,
    contactEmail: document.getElementById('l-email').value,
    projectType: document.getElementById('l-type').value,
    estimatedValue: parseInt(document.getElementById('l-value').value) || 0,
    status: document.getElementById('l-status').value,
    notes: document.getElementById('l-notes').value,
  });
  closeModal();
  toast('Lead added');
  render();
}

function openEditLeadModal(id) {
  const l = store.leads.find(x => x.id === id);
  openModal(`
    <div class="modal-title">Edit Lead</div>
    <div class="form-grid">
      <div class="form-group"><label>Company</label><input id="l-company" value="${l.company}"></div>
      <div class="form-group"><label>Contact Name</label><input id="l-contact" value="${l.contactName}"></div>
      <div class="form-group"><label>Contact Email</label><input id="l-email" value="${l.contactEmail}"></div>
      <div class="form-group"><label>Project Type</label>
        <select id="l-type">
          ${['Brand Activation','Pop-Up','Branding','Event','Creative Project','Other'].map(t=>`<option ${l.projectType===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Estimated Value (£)</label><input id="l-value" type="number" value="${l.estimatedValue || 0}"></div>
      <div class="form-group"><label>Status</label><select id="l-status">${statusOptions(l.status)}</select></div>
      <div class="form-group full"><label>Notes & Next Steps</label><textarea id="l-notes">${l.notes || ''}</textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveLead(${id})">Save</button>
    </div>
  `);
}

function saveLead(id) {
  const l = store.leads.find(x => x.id === id);
  l.company = document.getElementById('l-company').value.trim() || l.company;
  l.contactName = document.getElementById('l-contact').value;
  l.contactEmail = document.getElementById('l-email').value;
  l.projectType = document.getElementById('l-type').value;
  l.estimatedValue = parseInt(document.getElementById('l-value').value) || 0;

function deleteLead(id) {

function openNewProjectModal() {
  openModal(`
    <div class="modal-title">New Project</div>
    <div class="form-grid">
      <div class="form-group full"><label>Project Name</label><input id="f-name" placeholder="e.g. Summer Pop-Up"></div>

function createProject() {

    id: store.nextId.projects++, name,

    spent: 0,
    startDate: document.getElementById('f-start').value,
    endDate: document.getElementById('f-end').value,

  });
  closeModal(); toast('Project created'); render();
}

function openEditProjectModal() {
  const p = currentProject;
  openModal(`
    <div class="modal-title">Edit Project</div>
    <div class="form-grid">
      <div class="form-group full"><label>Project Name</label><input id="f-name" value="${p.name}"></div>
      <div class="form-group"><label>Client</label><input id="f-client" value="${p.client}"></div>

function saveProject() {
  const p = currentProject;
  p.name = document.getElementById('f-name').value.trim() || p.name;
  p.client = document.getElementById('f-client').value;
  p.type = document.getElementById('f-type').value;
  p.status = document.getElementById('f-status').value;
  p.budget = parseInt(document.getElementById('f-budget').value) || 0;
  p.startDate = document.getElementById('f-start').value;
  p.endDate = document.getElementById('f-end').value;

}

function openEditBriefModal() {
  const p = currentProject;
  openModal(`
    <div class="modal-title">Edit Brief</div>
    <div class="form-grid">
      <div class="form-group full"><label>Overview</label><textarea id="b-overview">${p.brief.overview}</textarea></div>
      <div class="form-group full"><label>Objectives</label><textarea id="b-objectives">${p.brief.objectives}</textarea></div>
      <div class="form-group full"><label>Deliverables</label><textarea id="b-deliverables">${p.brief.deliverables}</textarea></div>

      <button class="btn btn-primary" onclick="saveBrief()">Save Brief</button>
    </div>

}

function saveBrief() {
  const p = currentProject;
  p.brief.overview = document.getElementById('b-overview').value;
  p.brief.objectives = document.getElementById('b-objectives').value;
  p.brief.deliverables = document.getElementById('b-deliverables').value;
  p.brief.timeline = document.getElementById('b-timeline').value;
  closeModal(); toast('Brief saved'); render();
}

function openAllocateModal() {
  const p = currentProject;
  const available = store.team.filter(m => !p.teamIds.includes(m.id));
  openModal(`
    <div class="modal-title">Allocate Team Member</div>
    ${available.length === 0 ? '<p style="color:var(--muted)">All team members are already assigned.</p>' : `
    <div class="form-grid">
      <div class="form-group"><label>Team Member</label>
        <select id="f-member">${available.map(m=>`<option value="${m.id}">${m.name} — ${m.role} (£${m.rate}/day)</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Days Allocated</label><input id="f-days" type="number" value="1" min="0"></div>
    </div>`}
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      ${available.length > 0 ? `<button class="btn btn-primary" onclick="allocateMember()">Add to Project</button>` : ''}
    </div>
  `);
}

function allocateMember() {
  const memberId = parseInt(document.getElementById('f-member').value);
  const days = parseInt(document.getElementById('f-days').value) || 0;
  const p = currentProject;
  p.teamIds.push(memberId);
  if (!p.teamAllocation) p.teamAllocation = {};
  p.teamAllocation[memberId] = days;
  closeModal(); toast('Team member added'); render();
}

function removeTeamMember(id) {
  const p = currentProject;
  p.teamIds = p.teamIds.filter(tid => tid !== id);
  if (p.teamAllocation) delete p.teamAllocation[id];
  toast('Team member removed'); render();
}

function openAddExpenseModal() {
  openModal(`
    <div class="modal-title">Add Expense</div>
    <div class="form-grid">
      <div class="form-group full"><label>Description</label><input id="f-desc" placeholder="e.g. Venue hire"></div>
      <div class="form-group"><label>Category</label>
        <select id="f-cat"><option>Venue</option><option>Production</option><option>Staffing</option><option>Tech</option><option>Design</option><option>Travel</option><option>Other</option></select>
      </div>
      <div class="form-group"><label>Amount (£)</label><input id="f-amount" type="number" placeholder="0"></div>
      <div class="form-group"><label>Date</label><input id="f-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addExpense()">Add Expense</button>
    </div>
  `);
}

function addExpense() {
  const amount = parseFloat(document.getElementById('f-amount').value) || 0;
  const desc = document.getElementById('f-desc').value.trim();
  if (!desc) { toast('Description required'); return; }
  const p = currentProject;
  p.expenses.push({ id: store.nextId.expenses++, description: desc, category: document.getElementById('f-cat').value, amount, date: document.getElementById('f-date').value });
  p.spent = p.expenses.reduce((s, e) => s + e.amount, 0);
  closeModal(); toast('Expense added'); render();
}

function deleteExpense(id) {
  const p = currentProject;
  p.expenses = p.expenses.filter(e => e.id !== id);
  p.spent = p.expenses.reduce((s, e) => s + e.amount, 0);
  toast('Expense removed'); render();
}

function openAddContactToProjectModal() {
  const p = currentProject;
  const available = store.contacts.filter(c => !p.contactIds.includes(c.id));
  openModal(`
    <div class="modal-title">Add Contact to Project</div>
    ${available.length === 0 ? '<p style="color:var(--muted)">All contacts are already linked.</p>' : `
    <div class="form-group">
      <label>Select Contact</label>
      <select id="f-contact">${available.map(c=>`<option value="${c.id}">${c.name} — ${c.company}</option>`).join('')}</select>
    </div>`}
    <div style="margin-top:12px;color:var(--muted);font-size:12px">Don't see who you need? <a onclick="closeModal();navigate('contacts')" style="color:var(--accent);cursor:pointer">Add them to contacts first.</a></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      ${available.length > 0 ? `<button class="btn btn-primary" onclick="addContactToProject()">Add Contact</button>` : ''}

}

function addContactToProject() {
  currentProject.contactIds.push(parseInt(document.getElementById('f-contact').value));
  closeModal(); toast('Contact added'); render();
}

function removeContact(id) {
  currentProject.contactIds = currentProject.contactIds.filter(cid => cid !== id);
  toast('Contact removed'); render();
}

function openNewMemberModal() {
  openModal(`
    <div class="modal-title">Add Team Member</div>
    <div class="form-grid">
      <div class="form-group"><label>Full Name</label><input id="f-name" placeholder="Full name"></div>
      <div class="form-group"><label>Role</label><input id="f-role" placeholder="e.g. Designer"></div>
      <div class="form-group"><label>Email</label><input id="f-email" type="email"></div>
      <div class="form-group"><label>Day Rate (£)</label><input id="f-rate" type="number" placeholder="0"></div>
      <div class="form-group full"><label>Skills (comma separated)</label><input id="f-skills" placeholder="e.g. Branding, Motion, Print"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createMember()">Add Member</button>
    </div>
  `);
}

function createMember() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Name required'); return; }
  store.team.push({ id: store.nextId.team++, name, role: document.getElementById('f-role').value || 'Freelancer', email: document.getElementById('f-email').value, rate: parseInt(document.getElementById('f-rate').value) || 0, skills: document.getElementById('f-skills').value.split(',').map(s=>s.trim()).filter(Boolean) });

}

function openEditMemberModal(id) {
  const m = store.team.find(t => t.id === id);
  openModal(`
    <div class="modal-title">Edit Team Member</div>
    <div class="form-grid">
      <div class="form-group"><label>Full Name</label><input id="f-name" value="${m.name}"></div>
      <div class="form-group"><label>Role</label><input id="f-role" value="${m.role}"></div>
      <div class="form-group"><label>Email</label><input id="f-email" value="${m.email}"></div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveMember(${id})">Save</button>
    </div>
  `);
}

function saveMember(id) {
  const m = store.team.find(t => t.id === id);
  m.name = document.getElementById('f-name').value.trim() || m.name;
  m.role = document.getElementById('f-role').value;
  m.email = document.getElementById('f-email').value;
  m.rate = parseInt(document.getElementById('f-rate').value) || 0;
  m.skills = document.getElementById('f-skills').value.split(',').map(s=>s.trim()).filter(Boolean);
  closeModal(); toast('Saved'); render();
}

function deleteMember(id) {
  store.team = store.team.filter(m => m.id !== id);
  toast('Team member removed'); render();
}

function openEditContactModal(id) {
  const c = store.contacts.find(x => x.id === id);

    <div class="form-grid">
      <div class="form-group"><label>Full Name</label><input id="f-name" value="${c.name}"></div>

// ─── UTILS ────────────────────────────────────────────────────────────────────
function initials(name) { return name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2); }
function formatDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

render();
